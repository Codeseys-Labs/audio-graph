# Phase A scratch crate for audio-graph-60c7 (Decision 3.0 native runtime). Never shipped:
# it is outside src-tauri's workspace and exists only to prove parity before Phase B.
[package]
name = "d3-probe"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: do not join any parent workspace.
[workspace]

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
anyhow = "1"
candle-core = "=0.10.2"
candle-nn = "=0.10.2"
half = "2"
indexmap = { version = "2", features = ["serde"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[profile.release]
debug = 1
