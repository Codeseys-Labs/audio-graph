            -Pattern '^test .+::(cc9a_native_[^ ]+) \.\.\. ok$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Sort-Object -Unique
          $testNames | Set-Content -Path "$env:EVIDENCE_DIR/cc9a_native.names" -Encoding utf8
          Set-Content -Path "$env:EVIDENCE_DIR/cc9a_native.exit" -Value $nativeExit -Encoding ascii
          Set-Content -Path "$env:EVIDENCE_DIR/cc9a_native.tee.exit" -Value 0 -Encoding ascii
