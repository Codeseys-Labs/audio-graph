      - name: Summarize and enforce native exits (Unix)
        if: ${{ always() && matrix.os != 'windows' }}
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          cc9a="$(cat "$EVIDENCE_DIR/cc9a_native.exit" 2>/dev/null || printf 'not_run')"
          cc9a_tee="$(cat "$EVIDENCE_DIR/cc9a_native.tee.exit" 2>/dev/null || printf 'not_run')"
          cc9a_tests="$(cat "$EVIDENCE_DIR/cc9a_native.tests" 2>/dev/null || printf '0')"
          first="$(cat "$EVIDENCE_DIR/canonical_durability.exit" 2>/dev/null || printf 'not_run')"
          first_tee="$(cat "$EVIDENCE_DIR/canonical_durability.tee.exit" 2>/dev/null || printf 'not_run')"
          first_tests="$(cat "$EVIDENCE_DIR/canonical_durability.tests" 2>/dev/null || printf '0')"
          second="$(cat "$EVIDENCE_DIR/canonical_crash_harness.exit" 2>/dev/null || printf 'not_run')"
          second_tee="$(cat "$EVIDENCE_DIR/canonical_crash_harness.tee.exit" 2>/dev/null || printf 'not_run')"
          second_tests="$(cat "$EVIDENCE_DIR/canonical_crash_harness.tests" 2>/dev/null || printf '0')"
          cc9a_log=false
          durability_log=false
          crash_harness_log=false
          if [ -s "$EVIDENCE_DIR/cc9a_native.log" ]; then
            cc9a_log=true
          fi
          if [ -s "$EVIDENCE_DIR/canonical_durability.log" ]; then
            durability_log=true
          fi
          if [ -s "$EVIDENCE_DIR/canonical_crash_harness.log" ]; then
            crash_harness_log=true
          fi
          case "$cc9a_log:$durability_log:$crash_harness_log" in
            true:true:true) test_logs=full ;;
            false:false:false) test_logs=not_run ;;
            *) test_logs=partial ;;
          esac
          expected_cc9a_names="$(printf '%s\n' \
            'cc9a_native_qualified_guard_refuses_recreated_root_before_coordination_mutation' \
            'cc9a_native_qualified_initial_cas_has_parent_barrier' \
            'cc9a_native_qualified_replacement_refuses_foreign_open_head_before_temp_creation')"
          actual_cc9a_names="$(cat "$EVIDENCE_DIR/cc9a_native.names" 2>/dev/null || true)"
          cc9a_name_markers=FAIL
          if [ "$actual_cc9a_names" = "$expected_cc9a_names" ]; then
            cc9a_name_markers=PASS
          fi
          cc9a_artifacts=complete
          for artifact in cc9a_native.log cc9a_native.exit cc9a_native.tee.exit cc9a_native.tests cc9a_native.names; do
            if [ ! -s "$EVIDENCE_DIR/$artifact" ]; then
              cc9a_artifacts=incomplete
            fi
          done
          cc9a_macos_diagnostics_present=not_applicable
          cc9a_macos_diagnostics_complete=not_applicable
          cc9a_macos_exact_mount_identity=not_applicable
          macos_mount_diagnostics_complete=not_applicable
          mount_target_count=not_applicable
          mount_resolved_count=not_applicable
          mount_success_count=not_applicable
          mount_failure_count=not_applicable
          if [ "$RUNNER_OS" = "macOS" ]; then
            cc9a_macos_diagnostics_present=false
            cc9a_macos_diagnostics_complete=false
            cc9a_macos_exact_mount_identity=false
            macos_mount_diagnostics_complete=false
            mount_target_count="$(sed -n 's/^target_count=//p' \
              "$EVIDENCE_DIR/macos-mount-diagnostics.txt" 2>/dev/null || true)"
            mount_resolved_count="$(sed -n 's/^resolved_count=//p' \
              "$EVIDENCE_DIR/macos-mount-diagnostics.txt" 2>/dev/null || true)"
            mount_success_count="$(sed -n 's/^success_count=//p' \
              "$EVIDENCE_DIR/macos-mount-diagnostics.txt" 2>/dev/null || true)"
            mount_failure_count="$(sed -n 's/^failure_count=//p' \
              "$EVIDENCE_DIR/macos-mount-diagnostics.txt" 2>/dev/null || true)"
            if [ -s "$EVIDENCE_DIR/cc9a_macos_diagnostics.txt" ]; then
              cc9a_macos_diagnostics_present=true
              diagnostic_total_count="$(grep -c '^CC9A_MACOS_DIAGNOSTIC ' \
                "$EVIDENCE_DIR/cc9a_macos_diagnostics.txt" || true)"
              diagnostic_inventory_count="$(sed -n \
                -e 's/^CC9A_MACOS_DIAGNOSTIC root .* inventory_count=\([0-9][0-9]*\) root_fsid_result=available$/\1/p' \
                -e 's/^CC9A_MACOS_DIAGNOSTIC root .* inventory_count=\([0-9][0-9]*\) root_fsid_result=unavailable$/\1/p' \
                "$EVIDENCE_DIR/cc9a_macos_diagnostics.txt")"
              diagnostic_observation_count="$(grep -c '^CC9A_MACOS_DIAGNOSTIC observation ' \
                "$EVIDENCE_DIR/cc9a_macos_diagnostics.txt" || true)"
              diagnostic_observation_schema_count="$(grep -Ec '^CC9A_MACOS_DIAGNOSTIC observation index=[0-9]+ mount_path=.* filesystem_class=[^ ]+ filesystem_string=.* metadata_result=(available|unavailable) dev=([0-9]+|unavailable) same_root_dev=(true|false|unavailable) fsid_result=(available|unavailable) same_root_fsid=(true|false|unavailable) read_only=(true|false) removable=(true|false)$' \
                "$EVIDENCE_DIR/cc9a_macos_diagnostics.txt" || true)"
              diagnostic_root_count="$(grep -Ec '^CC9A_MACOS_DIAGNOSTIC root canonical_root=.* root_dev=.* inventory_count=[0-9]+ root_fsid_result=(available|unavailable)$' \
                "$EVIDENCE_DIR/cc9a_macos_diagnostics.txt" || true)"
              diagnostic_root_field_uniqueness_count="$(awk '
                /^CC9A_MACOS_DIAGNOSTIC root / {
                  if (gsub(/canonical_root=/, "&") == 1 &&
                    gsub(/root_dev=/, "&") == 1 &&
                    gsub(/inventory_count=/, "&") == 1 &&
                    gsub(/root_fsid_result=/, "&") == 1) {
                    valid += 1
                  }
                }
                END { print valid + 0 }
              ' "$EVIDENCE_DIR/cc9a_macos_diagnostics.txt")"
              diagnostic_summary_count="$(grep -Ec '^CC9A_MACOS_DIAGNOSTIC summary metadata_unavailable_count=[0-9]+ same_root_dev_count=[0-9]+ branch=(root_missing|zero_match_clean|zero_match_with_unavailable|unique|ambiguous|unique_then_validate_mismatch)$' \
                "$EVIDENCE_DIR/cc9a_macos_diagnostics.txt" || true)"
              diagnostic_exact_count="$(grep -Ec '^CC9A_MACOS_DIAGNOSTIC exact root_equals_data=true root_differs_system=true same_root_fsid_count=1 probe_unavailable_count=0 root_before_after_stable=true selection_authority=fsid mounted_on_text_authority=false$' \
                "$EVIDENCE_DIR/cc9a_macos_diagnostics.txt" || true)"
              if [ "$diagnostic_total_count" = 5 ] &&
                [ "$diagnostic_inventory_count" = 2 ] &&
                [ "$diagnostic_observation_count" = 2 ] &&
                [ "$diagnostic_observation_schema_count" = 2 ] &&
                [ "$diagnostic_root_count" = 1 ] &&
                [ "$diagnostic_root_field_uniqueness_count" = 1 ] &&
                [ "$diagnostic_summary_count" = 1 ] &&
                [ "$diagnostic_exact_count" = 1 ]; then
                cc9a_macos_diagnostics_complete=true
                cc9a_macos_exact_mount_identity=true
              fi
            fi
            if [ -s "$EVIDENCE_DIR/macos-mount-diagnostics.txt" ] &&
              [ "$(grep -c '^stat_target=' "$EVIDENCE_DIR/macos-mount-diagnostics.txt" || true)" = 3 ] &&
              [ "$(grep -c '^stat_exit=0$' "$EVIDENCE_DIR/macos-mount-diagnostics.txt" || true)" = 3 ] &&
              [ "$(grep -c '^diskutil_target=' "$EVIDENCE_DIR/macos-mount-diagnostics.txt" || true)" = 3 ] &&
              [ "$(grep -c '^target=' "$EVIDENCE_DIR/macos-mount-diagnostics.txt" || true)" = 3 ] &&
              [ "$(grep -c '^resolved_mount=' "$EVIDENCE_DIR/macos-mount-diagnostics.txt" || true)" = 3 ] &&
              [ "$(grep -c '^diskutil_exit=0$' "$EVIDENCE_DIR/macos-mount-diagnostics.txt" || true)" = 3 ] &&
              [ "$mount_target_count" = 3 ] &&
              [ "$mount_resolved_count" = 3 ] &&
              [ "$mount_success_count" = 3 ] &&
              [ "$mount_failure_count" = 0 ] &&
              grep -q '^mount_record=' "$EVIDENCE_DIR/macos-mount-diagnostics.txt" &&
              [ "$(grep -c '^diagnostics_complete=true$' \
                "$EVIDENCE_DIR/macos-mount-diagnostics.txt" || true)" = 1 ]; then
              macos_mount_diagnostics_complete=true
            fi
          fi
          status=PASS
          if [ "$cc9a" != 0 ] || [ "$cc9a_tee" != 0 ] ||
            [ "$cc9a_tests" != "$EXPECTED_CC9A_NATIVE_TESTS" ] ||
            [ "$cc9a_name_markers" != PASS ] || [ "$cc9a_artifacts" != complete ] ||
            [ "$first" != 0 ] || [ "$first_tee" != 0 ] ||
            [ "$second" != 0 ] || [ "$second_tee" != 0 ] ||
            [ "$test_logs" != full ] ||
            [ "$first_tests" != "$EXPECTED_DURABILITY_TESTS" ] ||
            [ "$second_tests" != "$EXPECTED_CRASH_HARNESS_TESTS" ]; then
            status=FAIL
          fi
          if [ "$RUNNER_OS" = "macOS" ] &&
            { [ "$cc9a_macos_diagnostics_present" != true ] ||
              [ "$cc9a_macos_diagnostics_complete" != true ] ||
              [ "$cc9a_macos_exact_mount_identity" != true ] ||
              [ "$macos_mount_diagnostics_complete" != true ]; }; then
            status=FAIL
          fi
          {
            printf 'status=%s\n' "$status"
            printf 'cc9a_native_exit=%s\n' "$cc9a"
            printf 'cc9a_native_tee_exit=%s\n' "$cc9a_tee"
            printf 'cc9a_native_tests=%s\n' "$cc9a_tests"
            printf 'cc9a_native_expected_tests=%s\n' "$EXPECTED_CC9A_NATIVE_TESTS"
            printf 'cc9a_native_name_markers=%s\n' "$cc9a_name_markers"
            printf 'cc9a_native_artifacts=%s\n' "$cc9a_artifacts"
            printf 'cc9a_macos_diagnostics_present=%s\n' "$cc9a_macos_diagnostics_present"
            printf 'cc9a_macos_diagnostics_complete=%s\n' "$cc9a_macos_diagnostics_complete"
            printf 'cc9a_macos_exact_mount_identity=%s\n' "$cc9a_macos_exact_mount_identity"
            printf 'macos_mount_diagnostics_complete=%s\n' "$macos_mount_diagnostics_complete"
            printf 'macos_mount_target_count=%s\n' "$mount_target_count"
            printf 'macos_mount_resolved_count=%s\n' "$mount_resolved_count"
            printf 'macos_mount_success_count=%s\n' "$mount_success_count"
            printf 'macos_mount_failure_count=%s\n' "$mount_failure_count"
            printf 'canonical_durability_exit=%s\n' "$first"
            printf 'canonical_durability_tee_exit=%s\n' "$first_tee"
            printf 'canonical_durability_tests=%s\n' "$first_tests"
            printf 'canonical_durability_expected_tests=%s\n' "$EXPECTED_DURABILITY_TESTS"
            printf 'canonical_crash_harness_exit=%s\n' "$second"
            printf 'canonical_crash_harness_tee_exit=%s\n' "$second_tee"
            printf 'canonical_crash_harness_tests=%s\n' "$second_tests"
            printf 'canonical_crash_harness_expected_tests=%s\n' "$EXPECTED_CRASH_HARNESS_TESTS"
            printf 'claim=process-crash recovery and completed OS-barrier outcomes only\n'
            printf 'power_loss_claim=false\n'
            printf 'test_logs=%s\n' "$test_logs"
          } > "$EVIDENCE_DIR/summary.txt"
          test "$status" = PASS

      - name: Summarize and enforce native exits (Windows)
        if: ${{ always() && matrix.os == 'windows' && inputs.confirm_vb_cable_professional_license == true }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null
          $cc9a = if (Test-Path "$env:EVIDENCE_DIR/cc9a_native.exit") {
            (Get-Content "$env:EVIDENCE_DIR/cc9a_native.exit" -Raw).Trim()
          } else { 'not_run' }
          $cc9aTee = if (Test-Path "$env:EVIDENCE_DIR/cc9a_native.tee.exit") {
            (Get-Content "$env:EVIDENCE_DIR/cc9a_native.tee.exit" -Raw).Trim()
          } else { 'not_run' }
          $cc9aTests = if (Test-Path "$env:EVIDENCE_DIR/cc9a_native.tests") {
            (Get-Content "$env:EVIDENCE_DIR/cc9a_native.tests" -Raw).Trim()
          } else { '0' }
          $first = if (Test-Path "$env:EVIDENCE_DIR/canonical_durability.exit") {
            (Get-Content "$env:EVIDENCE_DIR/canonical_durability.exit" -Raw).Trim()
          } else { 'not_run' }
          $firstTee = if (Test-Path "$env:EVIDENCE_DIR/canonical_durability.tee.exit") {
            (Get-Content "$env:EVIDENCE_DIR/canonical_durability.tee.exit" -Raw).Trim()
          } else { 'not_run' }
          $firstTests = if (Test-Path "$env:EVIDENCE_DIR/canonical_durability.tests") {
            (Get-Content "$env:EVIDENCE_DIR/canonical_durability.tests" -Raw).Trim()
          } else { '0' }
          $second = if (Test-Path "$env:EVIDENCE_DIR/canonical_crash_harness.exit") {
            (Get-Content "$env:EVIDENCE_DIR/canonical_crash_harness.exit" -Raw).Trim()
          } else { 'not_run' }
          $secondTee = if (Test-Path "$env:EVIDENCE_DIR/canonical_crash_harness.tee.exit") {
            (Get-Content "$env:EVIDENCE_DIR/canonical_crash_harness.tee.exit" -Raw).Trim()
          } else { 'not_run' }
          $secondTests = if (Test-Path "$env:EVIDENCE_DIR/canonical_crash_harness.tests") {
            (Get-Content "$env:EVIDENCE_DIR/canonical_crash_harness.tests" -Raw).Trim()
          } else { '0' }
          $cc9aLog = (Test-Path "$env:EVIDENCE_DIR/cc9a_native.log" -PathType Leaf) -and
            ((Get-Item "$env:EVIDENCE_DIR/cc9a_native.log").Length -gt 0)
          $durabilityLog = (Test-Path "$env:EVIDENCE_DIR/canonical_durability.log" -PathType Leaf) -and
            ((Get-Item "$env:EVIDENCE_DIR/canonical_durability.log").Length -gt 0)
          $crashHarnessLog = (Test-Path "$env:EVIDENCE_DIR/canonical_crash_harness.log" -PathType Leaf) -and
            ((Get-Item "$env:EVIDENCE_DIR/canonical_crash_harness.log").Length -gt 0)
          $testLogs = if ($cc9aLog -and $durabilityLog -and $crashHarnessLog) {
            'full'
          } elseif ($cc9aLog -or $durabilityLog -or $crashHarnessLog) {
            'partial'
          } else {
            'not_run'
          }
          $expectedCc9aNames = @(
            'cc9a_native_windows_qualified_existing_root_refuses_before_manifest_coordination_or_temp_mutation'
          )
          $actualCc9aNames = if (Test-Path "$env:EVIDENCE_DIR/cc9a_native.names") {
            @(Get-Content "$env:EVIDENCE_DIR/cc9a_native.names" | Where-Object { $_ })
          } else { @() }
          $cc9aNameMarkers = if (
            $actualCc9aNames.Count -eq $expectedCc9aNames.Count -and
            (Compare-Object $actualCc9aNames $expectedCc9aNames).Count -eq 0
          ) { 'PASS' } else { 'FAIL' }
          $cc9aArtifacts = 'complete'
          foreach ($artifact in @(
            'cc9a_native.log',
            'cc9a_native.exit',
            'cc9a_native.tee.exit',
            'cc9a_native.tests',
            'cc9a_native.names'
          )) {
            $artifactPath = Join-Path $env:EVIDENCE_DIR $artifact
            if (-not (Test-Path $artifactPath -PathType Leaf) -or
              (Get-Item $artifactPath).Length -eq 0) {
              $cc9aArtifacts = 'incomplete'
            }
          }
          $status = if (
            $cc9a -eq '0' -and $cc9aTee -eq '0' -and
            $cc9aTests -eq $env:EXPECTED_CC9A_NATIVE_TESTS -and
            $cc9aNameMarkers -eq 'PASS' -and $cc9aArtifacts -eq 'complete' -and
            $first -eq '0' -and $firstTee -eq '0' -and
            $firstTests -eq $env:EXPECTED_DURABILITY_TESTS -and
            $second -eq '0' -and $secondTee -eq '0' -and
            $secondTests -eq $env:EXPECTED_CRASH_HARNESS_TESTS -and
            $testLogs -eq 'full'
          ) { 'PASS' } else { 'FAIL' }
          @(
            "status=$status"
            "cc9a_native_exit=$cc9a"
            "cc9a_native_tee_exit=$cc9aTee"
            "cc9a_native_tests=$cc9aTests"
            "cc9a_native_expected_tests=$env:EXPECTED_CC9A_NATIVE_TESTS"
            "cc9a_native_name_markers=$cc9aNameMarkers"
            "cc9a_native_artifacts=$cc9aArtifacts"
            "canonical_durability_exit=$first"
            "canonical_durability_tee_exit=$firstTee"
            "canonical_durability_tests=$firstTests"
            "canonical_durability_expected_tests=$env:EXPECTED_DURABILITY_TESTS"
            "canonical_crash_harness_exit=$second"
            "canonical_crash_harness_tee_exit=$secondTee"
            "canonical_crash_harness_tests=$secondTests"
            "canonical_crash_harness_expected_tests=$env:EXPECTED_CRASH_HARNESS_TESTS"
            "claim=process-crash recovery and completed OS-barrier outcomes only"
            "power_loss_claim=false"
            "test_logs=$testLogs"
            "audio_claim=endpoint enumeration only"
          ) | Set-Content -Path "$env:EVIDENCE_DIR/summary.txt" -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Upload per-platform native durability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 2df3-native-durability-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
