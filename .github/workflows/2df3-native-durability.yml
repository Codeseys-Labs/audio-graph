# Seed audio-graph-52b9: manual, native evidence for audio-graph-2df3.
# This workflow proves only process-crash recovery and outcomes after returned OS
# barriers on the named live filesystems. It is not power-loss proof.
name: 2df3 Native Durability Evidence (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_vb_cable_professional_license:
        description: Confirm professional-use authorization for the Windows VB-CABLE CI baseline
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  native-durability:
    name: Native durability evidence (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: blacksmith-4vcpu-ubuntu-2404
            expected_cc9a_native_tests: 3
            expected_durability_tests: 47
            expected_crash_harness_tests: 11
          - os: macos
            runner: blacksmith-6vcpu-macos-15
            expected_cc9a_native_tests: 3
            expected_durability_tests: 17
            expected_crash_harness_tests: 11
          - os: windows
            runner: windows-2025
            expected_cc9a_native_tests: 1
            expected_durability_tests: 14
            expected_crash_harness_tests: 9
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/native-durability-evidence-${{ matrix.os }}
      EXPECTED_CC9A_NATIVE_TESTS: ${{ matrix.expected_cc9a_native_tests }}
      EXPECTED_DURABILITY_TESTS: ${{ matrix.expected_durability_tests }}
      EXPECTED_CRASH_HARNESS_TESTS: ${{ matrix.expected_crash_harness_tests }}
      # Used only to restore the exact TrustedPublisher target changed by the
      # pinned LABSN action. It is not an archive or installer provenance claim.
      LABSN_VBCABLE_CERT_SHA256: db9f6f54a13ef2ede5a8a7ba69dc841dc0711ba77ae7b173dd093e8455a4ed7e
    steps:
      - name: Initialize Unix evidence preflight
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'status=PREPARED\n'
            printf 'platform=%s\n' "${{ matrix.os }}"
            printf 'next=checkout\n'
            printf 'artifact_contract=nonempty_before_fallible_platform_work\n'
          } > "$EVIDENCE_DIR/preflight.txt"
          test -s "$EVIDENCE_DIR/preflight.txt"

      - name: Initialize Windows evidence preflight
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null
          @(
            "status=PREPARED"
            "platform=windows"
            "next=license_gate"
            "artifact_contract=nonempty_before_fallible_platform_work"
          ) | Set-Content -Path "$env:EVIDENCE_DIR/preflight.txt" -Encoding utf8
          if ((Get-Item "$env:EVIDENCE_DIR/preflight.txt").Length -eq 0) {
            throw "Windows evidence preflight must be nonempty."
          }

      - name: Refuse unconfirmed Windows professional-use run
        if: ${{ matrix.os == 'windows' && inputs.confirm_vb_cable_professional_license != true }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null
          $refusal = @(
            "status=REFUSED"
            "reason=confirm_vb_cable_professional_license must be true before Windows platform work"
            "license_material=not_requested_or_logged"
            "platform_work=not_started"
          )
          $refusal | Set-Content -Path "$env:EVIDENCE_DIR/preflight.txt" -Encoding utf8
          $refusal | Set-Content -Path "$env:EVIDENCE_DIR/summary.txt" -Encoding utf8
          Write-Error "Windows native evidence refused before checkout, LABSN, or platform work."
          exit 1

      - name: Check out requested revision
        if: ${{ matrix.os != 'windows' || inputs.confirm_vb_cable_professional_license == true }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: audio-graph

      - name: Install Rust 1.95.0
        if: ${{ matrix.os != 'windows' || inputs.confirm_vb_cable_professional_license == true }}
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Restore Rust cache
        if: ${{ matrix.os != 'windows' || inputs.confirm_vb_cable_professional_license == true }}
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake clang libclang-dev pkg-config

      - name: Install macOS system dependencies
        if: matrix.os == 'macos'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Configure MSVC environment
        if: ${{ matrix.os == 'windows' && inputs.confirm_vb_cable_professional_license == true }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Probe or install Windows system dependencies
        if: ${{ matrix.os == 'windows' && inputs.confirm_vb_cable_professional_license == true }}
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --version=3.31.0 -y --no-progress
          }
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm --version=19.1.5 -y --no-progress
            "C:\Program Files\LLVM\bin" |
              Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (Test-Path "C:\Program Files\CMake\bin") {
            "C:\Program Files\CMake\bin" |
              Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Record Unix runner, toolchain, command, and fixture-filesystem evidence
        if: matrix.os != 'windows'
        working-directory: audio-graph/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$GITHUB_SHA"
          {
            printf 'checked_out_sha=%s\n' "$checked_out_sha"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_image_os=%s\n' "${ImageOS:-unavailable}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unavailable}"
            uname -a
            if [ "$RUNNER_OS" = "macOS" ]; then
              sw_vers
            else
              sed -n -e 's/^PRETTY_NAME=/os_pretty_name=/p' \
                -e 's/^VERSION_ID=/os_version_id=/p' /etc/os-release
            fi
            rustc --version --verbose
            cargo --version --verbose
          } > "$EVIDENCE_DIR/runner-and-toolchain.txt"
          {
            printf '%s\n' \
              'cargo test --locked -p audio-graph --lib --no-default-features --features cloud cc9a_native_ -- --nocapture --test-threads=1'
            printf '%s\n' \
              'cargo test --locked -p audio-graph --lib --no-default-features --features cloud canonical_durability -- --nocapture --test-threads=1'
            printf '%s\n' \
              'cargo test --locked -p audio-graph --lib --no-default-features --features cloud persistence::canonical_crash_harness::tests -- --nocapture --test-threads=1'
          } > "$EVIDENCE_DIR/commands.txt"
          probe="$RUNNER_TEMP/audio-graph-2df3-filesystem-probe"
          mkdir -p "$probe"
          if [ "$RUNNER_OS" = "macOS" ]; then
            {
              printf 'fixture_parent=%s\n' "$probe"
              df -P "$probe"
              mount_point="$(df -P "$probe" | awk 'END { print $NF }')"
              /usr/sbin/diskutil info "$mount_point" | awk -F: '
                /File System Personality|Type \(Bundle\)|Device Node|Protocol/ {
                  key=$1; value=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", key);
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value);
                  print key "=" value
                }'
            } > "$EVIDENCE_DIR/fixture-filesystem.txt"
          else
            {
              printf 'fixture_parent=%s\n' "$probe"
              findmnt -T "$probe" -o TARGET,SOURCE,FSTYPE,OPTIONS -n
              stat -f -c \
                'filesystem_type=%T block_size=%S blocks=%b free_blocks=%f name_max=%l' \
                "$probe"
            } > "$EVIDENCE_DIR/fixture-filesystem.txt"
          fi
          rmdir "$probe"

      - name: Record macOS mount diagnostics
        if: ${{ always() && matrix.os == 'macos' }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$EVIDENCE_DIR"
          probe="$RUNNER_TEMP/audio-graph-2df3-filesystem-probe"
          mkdir -p "$probe"
          trap 'rmdir "$probe" 2>/dev/null || true' EXIT
          targets=("$probe" "/" "/System/Volumes/Data")
          target_count="${#targets[@]}"
          resolved_count=0
          success_count=0
          failure_count=0
          {
            printf 'probe_root=%s\n' "$probe"
            for target in "${targets[@]}"; do
              printf 'target=%s\n' "$target"
              printf 'stat_target=%s\n' "$target"
              stat_output="$(stat -f 'device=%d inode=%i flags=%f' "$target" 2>&1)"
              stat_exit="$?"
              printf 'stat_exit=%s\n' "$stat_exit"
              while IFS= read -r line; do
                printf 'stat_output=%s\n' "$line"
              done <<< "$stat_output"
            done
            mount | awk '$2 == "on" && ($3 == "/" || $3 == "/System/Volumes/Data") {
              print "mount_record=" $0
            }'
            for target in "${targets[@]}"; do
              printf 'diskutil_target=%s\n' "$target"
              df_output="$(df -P "$target" 2>&1)"
              df_exit="$?"
              printf 'df_exit=%s\n' "$df_exit"
              while IFS= read -r line; do
                printf 'df_output=%s\n' "$line"
              done <<< "$df_output"
              resolved_mount=""
              if [ "$df_exit" = 0 ]; then
                resolved_mount="$(printf '%s\n' "$df_output" | awk 'NR == 2 { print $NF }')"
              fi
              if [ -n "$resolved_mount" ]; then
                resolved_count="$((resolved_count + 1))"
                printf 'resolved_mount=%s\n' "$resolved_mount"
                diskutil_output="$(/usr/sbin/diskutil info "$resolved_mount" 2>&1)"
                diskutil_exit="$?"
                printf 'diskutil_exit=%s\n' "$diskutil_exit"
                while IFS= read -r line; do
                  printf 'diskutil_output=%s\n' "$line"
                done <<< "$diskutil_output"
                printf '%s\n' "$diskutil_output" | awk -F: '
                  /Device Node|Volume UUID|Volume Roles|APFS Volume Disk \(Role\)|File System Personality|Type \(Bundle\)|Read-Only Media|Read-Only Volume|Device Location|Internal|Removable Media/ {
                    key=$1; value=substr($0, index($0, ":") + 1);
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "", key);
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "", value);
                    print "diskutil_field=" key "=" value
                  }'
                if [ "$diskutil_exit" = 0 ]; then
                  success_count="$((success_count + 1))"
                else
                  failure_count="$((failure_count + 1))"
                fi
              else
                printf 'resolved_mount=unavailable\n'
                printf 'diskutil_exit=not_run\n'
                printf 'diskutil_output=mount_resolution_failed\n'
                failure_count="$((failure_count + 1))"
              fi
            done
            printf 'target_count=%s\n' "$target_count"
            printf 'resolved_count=%s\n' "$resolved_count"
            printf 'success_count=%s\n' "$success_count"
            printf 'failure_count=%s\n' "$failure_count"
            printf 'diagnostics_complete=true\n'
          } > "$EVIDENCE_DIR/macos-mount-diagnostics.txt"
          exit 0

      - name: Record Windows runner, toolchain, command, and fixture-filesystem evidence
        if: ${{ matrix.os == 'windows' && inputs.confirm_vb_cable_professional_license == true }}
        working-directory: audio-graph/src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null
          $checkedOutSha = (& git rev-parse HEAD).Trim()
          if ($checkedOutSha -ne $env:GITHUB_SHA) {
            throw "Checked-out SHA does not match GITHUB_SHA."
          }
          @(
            "checked_out_sha=$checkedOutSha"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "runner_name=$env:RUNNER_NAME"
            "runner_image_os=$(if ($env:ImageOS) { $env:ImageOS } else { 'unavailable' })"
            "runner_image_version=$(if ($env:ImageVersion) { $env:ImageVersion } else { 'unavailable' })"
          ) | Set-Content -Path "$env:EVIDENCE_DIR/runner-and-toolchain.txt" -Encoding utf8
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture |
            ConvertTo-Json -Compress |
            Out-File -FilePath "$env:EVIDENCE_DIR/runner-and-toolchain.txt" -Encoding utf8 -Append
          rustc --version --verbose |
            Out-File -FilePath "$env:EVIDENCE_DIR/runner-and-toolchain.txt" -Encoding utf8 -Append
          cargo --version --verbose |
            Out-File -FilePath "$env:EVIDENCE_DIR/runner-and-toolchain.txt" -Encoding utf8 -Append
          @(
            'AUDIOGRAPH_EMBED_WINDOWS_TEST_MANIFEST=1'
            'cargo test --locked -p audio-graph --lib --no-default-features --features cloud cc9a_native_ -- --nocapture --test-threads=1'
            'cargo test --locked -p audio-graph --lib --no-default-features --features cloud canonical_durability -- --nocapture --test-threads=1'
            'cargo test --locked -p audio-graph --lib --no-default-features --features cloud persistence::canonical_crash_harness::tests -- --nocapture --test-threads=1'
          ) | Set-Content -Path "$env:EVIDENCE_DIR/commands.txt" -Encoding utf8
          $probe = Join-Path $env:TEMP 'audio-graph-2df3-filesystem-probe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          $volume = [System.IO.Path]::GetPathRoot($probe)
          @(
            "fixture_parent=$probe"
            "fixture_volume=$volume"
          ) | Set-Content -Path "$env:EVIDENCE_DIR/fixture-filesystem.txt" -Encoding utf8
          if ([string]::IsNullOrWhiteSpace($volume) -or
            -not [System.IO.Path]::IsPathFullyQualified($probe) -or
            $volume -notmatch '^[A-Za-z]:\\$') {
            throw "Windows filesystem probe did not resolve to an absolute drive root."
          }
          $volumeToken = $volume.TrimEnd('\')
          if ($volumeToken -notmatch '^[A-Za-z]:$') {
            throw "Windows filesystem probe did not resolve to an fsutil volume token."
          }
          fsutil fsinfo volumeinfo $volumeToken |
            Out-File -FilePath "$env:EVIDENCE_DIR/fixture-filesystem.txt" -Encoding utf8 -Append
          Remove-Item -Path $probe -Force

      - name: Record LABSN Windows prestate
        id: labsn_prestate
        if: ${{ matrix.os == 'windows' && inputs.confirm_vb_cable_professional_license == true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetSha256 = $env:LABSN_VBCABLE_CERT_SHA256.ToLowerInvariant()
          $publisherMatches = @(
            Get-ChildItem 'Cert:\LocalMachine\TrustedPublisher' -ErrorAction Stop |
              Where-Object {
                [System.Convert]::ToHexString(
                  [System.Security.Cryptography.SHA256]::HashData($_.RawData)
                ).ToLowerInvariant() -eq $targetSha256
              }
          )
          if ($publisherMatches.Count -gt 1) {
            throw "Pinned LABSN publisher certificate has an ambiguous pre-action store state."
          }

          $endpoints = @(
            Get-PnpDevice -PresentOnly -ErrorAction Stop |
              Where-Object Class -eq 'AudioEndpoint' |
              Where-Object FriendlyName -Match 'CABLE (Input|Output)|VB-Audio Virtual Cable'
          )
          $cableEndpoints = @($endpoints)
          @(
            'setup_action=LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf'
            'action_inputs=none'
            'action_outputs=none'
            "publisher_match_count=$($publisherMatches.Count)"
            "preexisting_cable_endpoint_count=$($cableEndpoints.Count)"
            'license_material=not_requested_or_logged'
          ) | Set-Content -Path "$env:EVIDENCE_DIR/windows-labsn-prestate.txt" -Encoding utf8
          "publisher_match_count=$($publisherMatches.Count)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "preexisting_cable_endpoint_count=$($cableEndpoints.Count)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($cableEndpoints.Count -ne 0) {
            throw "VB-CABLE endpoints predate LABSN; refusing a non-causal installation canary."
          }

      - name: Install Windows virtual audio baseline with pinned LABSN action
        id: labsn_virtual_audio
        if: ${{ matrix.os == 'windows' && inputs.confirm_vb_cable_professional_license == true }}
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4

      - name: Restore LABSN TrustedPublisher state
        if: ${{ always() && matrix.os == 'windows' && inputs.confirm_vb_cable_professional_license == true }}
        shell: pwsh
        env:
          LABSN_ACTION_OUTCOME: ${{ steps.labsn_virtual_audio.outcome }}
          PUBLISHER_MATCH_COUNT_BEFORE: ${{ steps.labsn_prestate.outputs.publisher_match_count }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $targetSha256 = $env:LABSN_VBCABLE_CERT_SHA256.ToLowerInvariant()
          $before = $env:PUBLISHER_MATCH_COUNT_BEFORE
          $removalExits = @()
          $cleanupError = $false
          $cleanupStage = 'enumerate_before'
          $cleanupErrorStage = 'none'
          $matchesBeforeCleanup = @()
          $matchesAfterCleanup = @()
          try {
            $matchesBeforeCleanup = @(
              Get-ChildItem 'Cert:\LocalMachine\TrustedPublisher' -ErrorAction Stop |
                Where-Object {
                  [System.Convert]::ToHexString(
                    [System.Security.Cryptography.SHA256]::HashData($_.RawData)
                  ).ToLowerInvariant() -eq $targetSha256
                }
            )
            if ($before -eq '0') {
              $cleanupStage = 'remove_target'
              foreach ($certificate in $matchesBeforeCleanup) {
                & certutil.exe -delstore 'TrustedPublisher' $certificate.Thumbprint | Out-Null
                $removalExits += $LASTEXITCODE
              }
            }
            $cleanupStage = 'enumerate_after'
            $matchesAfterCleanup = @(
              Get-ChildItem 'Cert:\LocalMachine\TrustedPublisher' -ErrorAction Stop |
                Where-Object {
                  [System.Convert]::ToHexString(
                    [System.Security.Cryptography.SHA256]::HashData($_.RawData)
                  ).ToLowerInvariant() -eq $targetSha256
                }
            )
          } catch {
            $cleanupError = $true
            $cleanupErrorStage = $cleanupStage
          }
          $removalsSucceeded = @($removalExits | Where-Object { $_ -ne 0 }).Count -eq 0
          $publisherStateRestored =
            (-not $cleanupError) -and
            ($before -in @('0', '1')) -and
            ($matchesAfterCleanup.Count.ToString() -eq $before) -and
            $removalsSucceeded
          $restored = $publisherStateRestored.ToString().ToLowerInvariant()
          @(
            "action_outcome=$env:LABSN_ACTION_OUTCOME"
            "publisher_match_count_before=$before"
            "publisher_match_count_before_cleanup=$($matchesBeforeCleanup.Count)"
            "publisher_match_count_after_cleanup=$($matchesAfterCleanup.Count)"
            "publisher_removal_exit_count=$($removalExits.Count)"
            "publisher_removal_exits=$(@($removalExits) -join ',')"
            "publisher_cleanup_error=$($cleanupError.ToString().ToLowerInvariant())"
            "publisher_cleanup_error_stage=$cleanupErrorStage"
            "publisher_state_restored=$restored"
            'cleanup_scope=pinned_certificate_target_only'
          ) | Set-Content -Path "$env:EVIDENCE_DIR/windows-labsn-cleanup.txt" -Encoding utf8
          if (-not $publisherStateRestored) {
            throw "LABSN TrustedPublisher target state was not restored."
          }
          if ($env:LABSN_ACTION_OUTCOME -ne 'success') {
            throw "Pinned LABSN action did not report success after certificate restoration."
          }

      - name: Record bounded allowlisted Windows endpoint inventory
        if: ${{ matrix.os == 'windows' && inputs.confirm_vb_cable_professional_license == true }}
        shell: pwsh
        env:
          LABSN_ACTION_OUTCOME: ${{ steps.labsn_virtual_audio.outcome }}
        run: |
          @(
            'setup_action=LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf'
            'action_inputs=none'
            'action_outputs=none'
            "action_outcome=$env:LABSN_ACTION_OUTCOME"
            'action_archive_url_is_mutable=true'
            'archive_integrity_verified_by_caller=false'
            'catalog_signature_verified_by_caller=false'
            'catalog_members_verified_by_caller=false'
            'devcon_signature_verified_by_caller=false'
            'action_success_alone_is_installation_proof=false'
            'setup_proof_claimed=false'
            'setup_proof_artifact=windows-installation-canary.txt'
            'runner_lifetime=ephemeral_job_only'
            'persistent_runner=false'
            'license_material=not_requested_or_logged'
            'purpose=bounded_endpoint_enumeration_only'
            'excluded_claims=capture,playback,default_device,roundtrip,rsac'
          ) | Set-Content -Path "$env:EVIDENCE_DIR/windows-supply-chain-boundary.txt" -Encoding utf8
          if ($env:LABSN_ACTION_OUTCOME -ne 'success') {
            throw "LABSN action outcome is not success."
          }
          Start-Service -Name Audiosrv -ErrorAction Stop
          (Get-Service -Name Audiosrv).WaitForStatus(
            [System.ServiceProcess.ServiceControllerStatus]::Running,
            [TimeSpan]::FromSeconds(20)
          )
          $endpoints = @(
            Get-PnpDevice -Class AudioEndpoint -PresentOnly -ErrorAction Stop |
              Sort-Object FriendlyName, InstanceId |
              Select-Object -First 64 `
                @{Name = 'status'; Expression = { $_.Status }}, `
                @{Name = 'class'; Expression = { $_.Class }}, `
                @{Name = 'friendly_name'; Expression = { $_.FriendlyName }}, `
                @{Name = 'instance_id'; Expression = { $_.InstanceId }}
          )
          $cableEndpoints = @(
            $endpoints | Where-Object friendly_name -Match 'CABLE (Input|Output)|VB-Audio Virtual Cable'
          )
          $cableRender = @(
            $endpoints | Where-Object {
              $_.status -eq 'OK' -and
                $_.friendly_name -match '^(CABLE Input|Speakers) \(VB-Audio Virtual Cable\)$'
            }
          )
          $cableCapture = @(
            $endpoints | Where-Object {
              $_.status -eq 'OK' -and
                $_.friendly_name -match '^CABLE Output \(VB-Audio Virtual Cable\)$'
            }
          )
          $vbCableDevices = @(
            foreach ($device in @(Get-PnpDevice -PresentOnly -ErrorAction Stop)) {
              $property = Get-PnpDeviceProperty `
                -InstanceId $device.InstanceId `
                -KeyName 'DEVPKEY_Device_HardwareIds' `
                -ErrorAction SilentlyContinue
              $hardwareIds = ''
              if ($null -ne $property -and
                $property.PSObject.Properties.Name -contains 'Data') {
                $hardwareIds = @($property.Data) -join ';'
              }
              if ($device.Status -eq 'OK' -and $hardwareIds -match 'VBAudioVACWDM') {
                $device
              }
            }
          )
          $audioService = Get-Service -Name Audiosrv -ErrorAction Stop
          [ordered]@{
            schema = 'audio-graph-2df3-endpoint-inventory-v1'
            allowlisted_fields = @('status', 'class', 'friendly_name', 'instance_id')
            max_records = 64
            record_count = $endpoints.Count
            vb_cable_record_count = $cableEndpoints.Count
            vb_cable_device_count = $vbCableDevices.Count
            audiosrv_status = $audioService.Status.ToString()
            records = $endpoints
          } | ConvertTo-Json -Depth 5 |
            Set-Content -Path "$env:EVIDENCE_DIR/windows-endpoints.json" -Encoding utf8
          if ($endpoints.Count -eq 0) {
            throw "No present AudioEndpoint records found after the enumeration baseline."
          }
          if ($cableEndpoints.Count -lt 2 -or $cableRender.Count -eq 0 -or $cableCapture.Count -eq 0) {
            throw "Expected VB-CABLE render and capture endpoints must both be present after LABSN."
          }
          if ($vbCableDevices.Count -eq 0) {
            throw "No present and healthy VBAudioVACWDM device is available after LABSN."
          }
          if ($audioService.Status -ne 'Running') {
            throw "Audiosrv must be running after the LABSN action."
          }
          @(
            'status=PASS'
            'proof=post_action_vb_cable_device_and_endpoint_presence'
            "vb_cable_device_count=$($vbCableDevices.Count)"
            "ready_render_endpoint_count=$($cableRender.Count)"
            "ready_capture_endpoint_count=$($cableCapture.Count)"
            "audiosrv_status=$($audioService.Status)"
            'evidence_class=device_and_endpoint_enumeration_only_no_pcm'
          ) | Set-Content -Path "$env:EVIDENCE_DIR/windows-installation-canary.txt" -Encoding utf8

      - name: Run cc9a native qualification filter (Unix)
        if: matrix.os != 'windows'
        working-directory: audio-graph/src-tauri
        shell: bash
        timeout-minutes: 45
        continue-on-error: true
        run: |
          set +e
          cargo test --locked -p audio-graph --lib --no-default-features --features cloud cc9a_native_ -- --nocapture --test-threads=1 \
            2>&1 | tee "$EVIDENCE_DIR/cc9a_native.log"
          pipeline_status=("${PIPESTATUS[@]}")
          native_exit="${pipeline_status[0]}"
          tee_exit="${pipeline_status[1]}"
          test_count="$(awk '$1 == "running" && $2 ~ /^[0-9]+$/ && ($3 == "test" || $3 == "tests") { print $2; exit }' \
            "$EVIDENCE_DIR/cc9a_native.log")"
          awk '
            $1 == "test" && $2 ~ /cc9a_native_/ && $3 == "..." {
              name=$2
              sub(/:$/, "", name)
              sub(/^.*::/, "", name)
              pending_name=""
              if ($4 == "ok" && NF == 4) {
                print name
              } else if ($4 == "CC9A_MACOS_DIAGNOSTIC") {
                pending_name=name
              }
              next
            }
            pending_name != "" && $0 ~ /^CC9A_MACOS_DIAGNOSTIC / { next }
            pending_name != "" && $0 == "ok" {
              print pending_name
              pending_name=""
              next
            }
            pending_name != "" { pending_name="" }
          ' "$EVIDENCE_DIR/cc9a_native.log" | LC_ALL=C sort -u > "$EVIDENCE_DIR/cc9a_native.names"
          if [ "$RUNNER_OS" = "macOS" ]; then
            awk '
              {
                marker=index($0, "CC9A_MACOS_DIAGNOSTIC ")
                if (marker == 1 ||
                  ($1 == "test" && $2 ~ /cc9a_native_/ && $3 == "..." && $4 == "CC9A_MACOS_DIAGNOSTIC")) {
                  print substr($0, marker)
                }
              }
            ' "$EVIDENCE_DIR/cc9a_native.log" > "$EVIDENCE_DIR/cc9a_macos_diagnostics.txt"
          fi
          printf '%s\n' "$native_exit" > "$EVIDENCE_DIR/cc9a_native.exit"
          printf '%s\n' "$tee_exit" > "$EVIDENCE_DIR/cc9a_native.tee.exit"
          printf '%s\n' "${test_count:-0}" > "$EVIDENCE_DIR/cc9a_native.tests"
          exit 0

