# AudioGraph CI — Tauri v2 desktop app
# Frontend checks + Rust backend checks per platform.
#
# The Tauri backend pins rsac by full Git revision in Cargo.toml and commits the
# application Cargo.lock. Product Cargo and Tauri commands use `--locked`, so
# Cargo resolution is the single CI dependency authority on every platform.
#
# Third-party actions are SHA-pinned with a trailing `# vN` comment so
# Dependabot can keep them current without losing reproducibility.

name: AudioGraph CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# Default minimal token scope. Individual jobs can elevate if needed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Lints (single source of truth for fmt + clippy) ────────────────
  # Runs once on Linux; macOS and Windows trust this signal so we never
  # ship a Linux-only `cfg` block that's unformatted on another OS.
  lints:
    name: Lints (fmt + clippy)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # local-ml (whisper.cpp + llama.cpp + mistral.rs) is the default feature
    # set, and clippy --all-targets additionally compiles the test targets.
    # docs/adr/0007 documents a clean `cargo check` at ~5 min and a debug
    # `tauri build` at ~11.5 min on a dev workstation; a Swatinem/rust-cache
    # miss (e.g. a toolchain bump, since add-rust-environment-hash-key hashes
    # rustc+env into the restore key) makes this a cold build. 30 min gives
    # headroom above that documented cost on 4-vCPU runners.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          path: audio-graph

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/src-tauri

      # System deps. `cargo check` / `cargo clippy --all-targets` link the
      # full test binaries, which transitively pull in glib-sys / gdk-sys /
      # gtk-sys / cairo / harfbuzz / atk via Tauri v2's Linux runtime — even
      # though no test instantiates a real webview. We drop only xvfb since
      # the test process never spawns an X11 display.
      - name: Install system dependencies
        run: |
          sudo add-apt-repository ppa:pipewire-debian/pipewire-upstream -y
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake clang libclang-dev pkg-config

      - name: Format check
        working-directory: audio-graph/src-tauri
        run: cargo fmt --check

      - name: Verify Cargo-locked rsac resolution
        working-directory: audio-graph/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          # The manifest pin is the source of truth, so the next rsac upgrade
          # needs no edit here; a trip names expected vs resolved instead of
          # printing a bare jq boolean.
          expected_rev=$(sed -n 's/^rsac = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml | sort -u)
          if [ "$(printf '%s' "$expected_rev" | wc -w)" -ne 1 ]; then
            echo "::error::the per-target rsac pins in Cargo.toml are missing or disagree: [${expected_rev}]"
            exit 1
          fi
          metadata=$(cargo metadata --format-version 1 --locked)
          count=$(printf '%s' "$metadata" | jq '[.packages[] | select(.name == "rsac")] | length')
          resolved=$(printf '%s' "$metadata" | jq -r '[.packages[] | select(.name == "rsac")] | map(.version + " @ " + .source) | join("; ")')
          if [ "$count" -ne 1 ] || [[ "$resolved" != *"rev=${expected_rev}#${expected_rev}"* ]]; then
            echo "::error::Cargo resolved rsac [${resolved}] (count ${count}) but Cargo.toml pins rev ${expected_rev}"
            exit 1
          fi
          echo "rsac resolved: ${resolved}"

      - name: Clippy
        working-directory: audio-graph/src-tauri
        # Hard gate: the full default-feature tree (incl. local-ml) is
        # clippy-clean, verified on Linux. Keep it that way.
        run: cargo clippy --locked --all-targets -- -D warnings

  # ── Frontend (fast, platform-independent) ──────────────────────────
  frontend:
    name: Frontend (TypeScript)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
      - run: bun install --frozen-lockfile
      - name: Biome (format + lint)
        run: bunx @biomejs/biome ci .
      - name: Typecheck
        run: bun run tsc --noEmit
      - name: Vitest
        run: bun run test:coverage
      - name: Production build
        run: bun run build

  # ── Security audit (independent, fast, doesn't gate on Rust build) ─
  security-audit:
    name: cargo audit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      # Pinned so the security gate is reproducible; nothing here bumps this
      # automatically (Dependabot doesn't track `cargo install` versions
      # inside a `run:` string), so re-check https://crates.io/crates/cargo-audit
      # by hand periodically and bump this value.
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          path: audio-graph

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      # This job has no Cargo workspace of its own (it only builds/runs the
      # cargo-audit tool binary), so `cache-targets: false` is deliberate: we
      # use rust-cache purely for its `~/.cargo/bin` tool-binary cache
      # (`cache-bin`, default true), keyed on the pinned tool version rather
      # than the product Cargo.lock, so ordinary app dependency bumps don't
      # invalidate this cache.
      - name: Cache cargo-audit ${{ env.CARGO_AUDIT_VERSION }} binary
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-targets: false
          cache-bin: true
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        run: |
          if command -v cargo-audit >/dev/null 2>&1 && \
             [ "$(cargo audit --version 2>/dev/null | awk '{print $2}')" = "${CARGO_AUDIT_VERSION}" ]; then
            echo "cargo-audit ${CARGO_AUDIT_VERSION} already present (cache hit)"
          else
            cargo install --locked --version "${CARGO_AUDIT_VERSION}" cargo-audit
          fi

      - name: Cargo audit
        # Hard gate: advisories are either ignored in `.cargo/audit.toml`
        # (with per-RUSTSEC justification) or must be resolved.
        working-directory: audio-graph/src-tauri
        run: cargo audit

      # `ignore` in audit.toml is an unconditional advisory-ID suppression, so a
      # stanza whose justification is "this package is unreachable" would keep
      # passing after the package became reachable. The RUSTSEC-2026-0235
      # (rkyv 0.7.46) stanza states exactly that condition and names this command
      # as its own remediation trigger, so assert it here rather than trusting a
      # reader to re-run it by hand.
      #
      # Matched against the advisory's AFFECTED RANGE (patched is ">= 0.8.17"),
      # not a pinned version: a check keyed on rkyv@0.7.46 alone would pass
      # silently if the lockfile later resolved 0.7.47 or 0.8.10, both still
      # vulnerable and both still suppressed by the ID-level ignore.
      #
      # Version logic unit-checked against synthetic input before landing:
      # 0.7.46 and 0.8.16 flag; 0.8.17, 0.9.0, and 1.0.0 do not.
      - name: Assert no affected rkyv is reachable
        working-directory: audio-graph/src-tauri
        run: |
          affected="$(
            cargo tree --locked --target all --all-features --edges all \
              --format '{p}' --prefix none 2>/dev/null \
            | awk '
                $1 == "rkyv" {
                  v = $2; sub(/^v/, "", v);
                  split(v, p, ".");
                  if ((p[1]+0) == 0 && ((p[2]+0) < 8 || ((p[2]+0) == 8 && (p[3]+0) < 17)))
                    print $1 " " $2;
                }' \
            | sort -u
          )"
          if [ -n "$affected" ]; then
            echo "::error::RUSTSEC-2026-0235's ignore in .cargo/audit.toml is justified only while no affected rkyv (< 0.8.17) is reachable, but one now is:"
            printf '%s\n' "$affected"
            echo "::error::Remove that ignore and resolve the advisory, or replace its justification with one that matches reality."
            exit 1
          fi
          echo "No affected rkyv (< 0.8.17) is reachable; the RUSTSEC-2026-0235 ignore stays justified."

  # ── Rust backend — Linux ───────────────────────────────────────────
  # Tests use `tauri::test::mock_context` + `noop_assets` + `any_thread()`
  # in src/speech/tests_integration.rs. Even with MockRuntime, tao's Linux
  # event_loop still attempts an X11 connection at construction time
  # (tao-0.35.2/src/platform_impl/linux/event_loop.rs:217), so we keep
  # xvfb-run wrapping cargo test. The full GTK chain (glib-sys / gdk-sys /
  # gtk-sys / cairo / harfbuzz / atk) is also linked into the test binary
  # transitively via Tauri.
  rust-linux:
    name: Rust (Linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Default features == local-ml (whisper.cpp + llama.cpp + mistral.rs); a
    # rust-cache miss (toolchain bump, cache eviction against the 10 GB
    # per-repo ceiling) makes this a cold build+test, documented elsewhere in
    # this repo at 13-20 min (docs/WINDOWS_QUICKSTART.md, docs/commit-state-
    # 2026-08-14-*). 30 min matches the margin sibling local-ml jobs in this
    # file already carry (rust-windows-debug-crt-smoke: 25 min for compile
    # alone; storage-engine-evidence / Default Tauri smoke: 30 min).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          path: audio-graph

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/src-tauri

      - name: Install system dependencies
        run: |
          sudo add-apt-repository ppa:pipewire-debian/pipewire-upstream -y
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake clang libclang-dev pkg-config xvfb

      - name: Cargo check
        working-directory: audio-graph/src-tauri
        run: cargo check --locked

      - name: Cargo test
        working-directory: audio-graph/src-tauri
        # speech::tests_integration uses tauri::test::mock_context + any_thread.
        # Despite mocking the runtime, tao's Linux event_loop still attempts
        # an X11 connection at construction. xvfb-run gives it a virtual
        # display; the test itself does not render anything.
        run: xvfb-run -a cargo test --locked -- --test-threads=1

  # ── Rust backend + app compile — cloud-only cross-platform smoke ───
  # This matrix is the fast remote confidence path for provider/settings work:
  # it keeps rsac and Tauri in the build while avoiding the heavyweight local
  # ML feature tree. Use workflow_dispatch to validate branches remotely before
  # relying on local WSL/Linux-only builds.
  rust-cloud-smoke:
    name: Cloud-only smoke (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - os: macos
            runner: blacksmith-6vcpu-macos-15
          - os: windows
            runner: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          path: audio-graph

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake clang libclang-dev pkg-config xvfb

      - name: Install macOS system dependencies
        if: matrix.os == 'macos'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: matrix.os == 'windows'

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2

      - name: Install frontend dependencies
        working-directory: audio-graph
        run: bun install --frozen-lockfile

      - name: Cargo check (cloud-only)
        working-directory: audio-graph/src-tauri
        run: cargo check --locked --no-default-features --features cloud

      - name: Cargo test (cloud-only, Linux)
        if: matrix.os == 'linux'
        working-directory: audio-graph/src-tauri
        run: xvfb-run -a cargo test --locked --no-default-features --features cloud -- --test-threads=1

      - name: Playback resampling regression diagnostics (cloud-only, Linux)
        if: matrix.os == 'linux' && failure()
        working-directory: audio-graph/src-tauri
        run: xvfb-run -a cargo test --locked -p audio-graph --lib --no-default-features --features cloud playback -- --nocapture --test-threads=1

      - name: Cargo test (cloud-only)
        if: matrix.os != 'linux'
        working-directory: audio-graph/src-tauri
        env:
          AUDIOGRAPH_EMBED_WINDOWS_TEST_MANIFEST: ${{ matrix.os == 'windows' && '1' || '' }}
        run: cargo test --locked --no-default-features --features cloud -- --test-threads=1

      - name: Playback resampling regression diagnostics (cloud-only)
        if: matrix.os != 'linux' && failure()
        working-directory: audio-graph/src-tauri
        env:
          AUDIOGRAPH_EMBED_WINDOWS_TEST_MANIFEST: ${{ matrix.os == 'windows' && '1' || '' }}
        run: cargo test --locked -p audio-graph --lib --no-default-features --features cloud playback -- --nocapture --test-threads=1

      - name: Tauri compile smoke (cloud-only, no bundle)
        working-directory: audio-graph
        run: bun run tauri build --no-bundle --ci -- --locked --no-default-features --features cloud

  # ── Path classification for the optional-feature matrix ────────────
  # Filters rust-optional-feature-smoke's matrix down to only the profiles
  # whose exclusive source files changed; fails SAFE to the full matrix on
  # any workflow/build-system/shared-dispatch-file change; emits
  # {"include":[]} on `pull_request` and when nothing optional-feature-relevant
  # changed. An empty `{"include":[]}` matrix does NOT skip the consumer job —
  # GitHub fails strategy evaluation on a zero-vector matrix — so the consumer
  # carries its own `if:` guard on this exact output string. Always runs (no
  # `if:`) so that guard always has a defined value to compare against.
  classify-optional-feature-paths:
    name: Classify optional-feature paths
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.classify.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          fetch-depth: 0
          path: audio-graph

      - name: Classify changed paths and emit the filtered optional-feature matrix
        id: classify
        working-directory: audio-graph
        shell: bash
        run: |
          set -euo pipefail
          full_table='[
            {"profile":"asr-moonshine","features":"cloud,asr-moonshine","test_filter":"moonshine","os":"linux","runner":"blacksmith-4vcpu-ubuntu-2404"},
            {"profile":"asr-moonshine","features":"cloud,asr-moonshine","test_filter":"moonshine","os":"macos","runner":"blacksmith-6vcpu-macos-15"},
            {"profile":"asr-moonshine","features":"cloud,asr-moonshine","test_filter":"moonshine","os":"windows","runner":"blacksmith-4vcpu-windows-2025"},
            {"profile":"diarization-clustering","features":"cloud,diarization-clustering","test_filter":"diarization","os":"linux","runner":"blacksmith-4vcpu-ubuntu-2404"},
            {"profile":"diarization-clustering","features":"cloud,diarization-clustering","test_filter":"diarization","os":"macos","runner":"blacksmith-6vcpu-macos-15"},
            {"profile":"diarization-clustering","features":"cloud,diarization-clustering","test_filter":"diarization","os":"windows","runner":"blacksmith-4vcpu-windows-2025"},
            {"profile":"sherpa-streaming","features":"cloud,sherpa-streaming","test_filter":"sherpa_streaming","os":"linux","runner":"blacksmith-4vcpu-ubuntu-2404"},
            {"profile":"sherpa-streaming","features":"cloud,sherpa-streaming","test_filter":"sherpa_streaming","os":"macos","runner":"blacksmith-6vcpu-macos-15"},
            {"profile":"sherpa-streaming","features":"cloud,sherpa-streaming","test_filter":"sherpa_streaming","os":"windows","runner":"blacksmith-4vcpu-windows-2025"},
            {"profile":"llm-llama","features":"cloud,llm-llama","test_filter":"local_llama_stream","os":"linux","runner":"blacksmith-4vcpu-ubuntu-2404"},
            {"profile":"llm-llama","features":"cloud,llm-llama","test_filter":"local_llama_stream","os":"macos","runner":"blacksmith-6vcpu-macos-15"},
            {"profile":"llm-llama","features":"cloud,llm-llama","test_filter":"local_llama_stream","os":"windows","runner":"blacksmith-4vcpu-windows-2025"},
            {"profile":"llm-mistralrs","features":"cloud,llm-mistralrs","test_filter":"mistralrs_engine","os":"linux","runner":"blacksmith-4vcpu-ubuntu-2404"},
            {"profile":"llm-mistralrs","features":"cloud,llm-mistralrs","test_filter":"mistralrs_engine","os":"macos","runner":"blacksmith-6vcpu-macos-15"},
            {"profile":"llm-mistralrs","features":"cloud,llm-mistralrs","test_filter":"mistralrs_engine","os":"windows","runner":"blacksmith-4vcpu-windows-2025"}
          ]'
          emit_full() { echo "matrix=$(jq -c '{include: .}' <<<"$full_table")" >> "$GITHUB_OUTPUT"; }
          emit_empty() { echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            emit_empty; echo "pull_request: optional-feature matrix stays PR-excluded"; exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            emit_full; echo "${{ github.event_name }}: full optional-feature matrix"; exit 0
          fi

          before="${{ github.event.before }}"; after="${{ github.event.after }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            emit_full; echo "no usable before-SHA: full optional-feature matrix (fail-safe)"; exit 0
          fi

          changed="$(git diff --name-only "${before}" "${after}")"
          fail_safe_re='^(\.github/workflows/.*|src-tauri/(Cargo\.(toml|lock)|build\.rs)|Cargo\.(toml|lock)|package\.json|bun\.lock|src-tauri/src/(commands\.rs|lib\.rs|error\.rs|provider_registry\.rs|projections\.rs|projection_data_movement\.rs|speech/mod\.rs|asr/mod\.rs|settings/mod\.rs|models/mod\.rs|llm/mod\.rs|llm/route\.rs|llm/api_client\.rs|llm/executor\.rs))$'
          declare -A pattern=(
            [asr-moonshine]='^src-tauri/src/asr/moonshine\.rs$'
            [sherpa-streaming]='^src-tauri/src/asr/sherpa_streaming\.rs$'
            [diarization-clustering]='^src-tauri/src/diarization/'
            [llm-llama]='^src-tauri/src/llm/(engine|streaming)\.rs$'
            [llm-mistralrs]='^src-tauri/src/llm/mistralrs_engine\.rs$'
          )

          fail_safe=0; affected=()
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            [[ "$path" =~ $fail_safe_re ]] && fail_safe=1
            for profile in "${!pattern[@]}"; do
              [[ "$path" =~ ${pattern[$profile]} ]] && case " ${affected[*]:-} " in
                *" ${profile} "*) ;; *) affected+=("$profile") ;;
              esac
            done
          done <<< "$changed"

          if [ "$fail_safe" -eq 1 ]; then
            emit_full; echo "workflow/build-system/shared-dispatch change: full matrix (fail-safe)"
          elif [ "${#affected[@]}" -eq 0 ]; then
            emit_empty; echo "no optional-feature-relevant path changed: empty matrix"
          else
            affected_json=$(printf '%s\n' "${affected[@]}" | jq -R . | jq -sc .)
            echo "matrix=$(jq -c --argjson p "$affected_json" '{include: [.[] | select(.profile as $x | $p | index($x) != null)]}' <<<"$full_table")" >> "$GITHUB_OUTPUT"
            echo "affected profiles: ${affected_json}"
          fi

  # ── Optional Rust features — cross-platform compile smoke ─────────
  # These are not PR gates yet: they exercise local/runtime feature shapes that
  # need Blacksmith OS evidence without requiring downloaded models or live
  # provider credentials. The matrix is filtered by
  # classify-optional-feature-paths above; that job always resolves PRs (and
  # any push that touches nothing optional-feature-relevant) to the literal
  # string '{"include":[]}'. A dynamic matrix with zero vectors is a hard
  # strategy-evaluation FAILURE in GitHub Actions, not a skip, so this job
  # keeps an explicit `if:` guard on that exact string.
  rust-optional-feature-smoke:
    name: Optional feature smoke (${{ matrix.profile }}, ${{ matrix.os }})
    needs: classify-optional-feature-paths
    if: needs.classify-optional-feature-paths.outputs.matrix != '{"include":[]}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify-optional-feature-paths.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          path: audio-graph

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake clang libclang-dev pkg-config xvfb

      - name: Install macOS system dependencies
        if: matrix.os == 'macos'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: matrix.os == 'windows'

      - name: Probe / install Windows system dependencies
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            Write-Host "Installing cmake"
            choco install cmake --version=3.31.0 -y --no-progress
          } else {
            Write-Host "cmake already present"
          }
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            Write-Host "Installing llvm"
            choco install llvm --version=20.1.8 -y --no-progress
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "llvm already present"
          }
          if (Test-Path "C:\Program Files\CMake\bin") {
            "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      # Linux uses bash for `xvfb-run`; macOS/Windows use the OS default shell so
      # that on Windows MSVC's link.exe wins the PATH race (under `shell: bash`,
      # Git-Bash's /usr/bin/link shadows MSVC link.exe and the link step fails).
      # This mirrors the proven-passing rust-cloud-smoke job (no `shell: bash` on
      # its non-Linux cargo steps).
      - name: Cargo check (${{ matrix.profile }}, Linux)
        if: matrix.os == 'linux'
        working-directory: audio-graph/src-tauri
        shell: bash
        run: cargo check --locked --no-default-features --features "${{ matrix.features }}"

      - name: Cargo check (${{ matrix.profile }})
        if: matrix.os != 'linux'
        working-directory: audio-graph/src-tauri
        run: cargo check --locked --no-default-features --features "${{ matrix.features }}"

      - name: Cargo test (${{ matrix.profile }}, Linux)
        if: matrix.os == 'linux'
        working-directory: audio-graph/src-tauri
        shell: bash
        run: xvfb-run -a cargo test --locked -p audio-graph --lib --no-default-features --features "${{ matrix.features }}" ${{ matrix.test_filter }} -- --nocapture --test-threads=1

      - name: Cargo test (${{ matrix.profile }})
        if: matrix.os != 'linux'
        working-directory: audio-graph/src-tauri
        env:
          AUDIOGRAPH_EMBED_WINDOWS_TEST_MANIFEST: ${{ matrix.os == 'windows' && '1' || '' }}
        run: cargo test --locked -p audio-graph --lib --no-default-features --features "${{ matrix.features }}" ${{ matrix.test_filter }} -- --nocapture --test-threads=1

  # ── Windows --debug CRT smoke (seed audio-graph-d47b) ─────────────
  # A --debug Windows build links the MSVC DEBUG CRT (/MDd), but the bundled
  # native ML libs (whisper.cpp / llama.cpp / ggml, built by cmake-rs + cc) are
  # compiled against the RELEASE CRT (/MD): cc 1.2.62 has no /MDd path and
  # cmake-rs 0.1.58 never sets CMAKE_MSVC_RUNTIME_LIBRARY, and the -sys scripts
  # force a Release-family CMAKE_BUILD_TYPE. A block allocated by one CRT's heap
  # and freed by the other trips the debug heap validator
  # (is_block_type_valid, debug_heap.cpp:908). This job forces the C++ deps to
  # the DEBUG dynamic CRT so both sides share one heap, then RUNS the debug
  # local-ml binary so the validator actually executes and would abort on
  # regression. Off PRs — the local-ML compile is ~13-15 min.
  # See docs/ops/windows-debug-crt-fix.md for the full mechanism.
  rust-windows-debug-crt-smoke:
    name: Windows --debug CRT smoke (local-ml)
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 25
    env:
      # d47b: force the cmake/cc-built ML deps to the DEBUG dynamic CRT (/MDd)
      # so they share one heap with rustc's /MDd debug build. Two mechanisms,
      # because the two libraries differ on CMake policy CMP0091:
      #   - llama.cpp (cmake_minimum_required ...3.28 → CMP0091 NEW) honors the
      #     MSVC_RUNTIME_LIBRARY abstraction.
      #   - whisper.cpp (cmake_minimum_required 3.5, no policy-max → CMP0091 OLD)
      #     ignores it and reads the runtime flag from CMAKE_*_FLAGS instead.
      # Both -sys build scripts pass CMAKE_*/CFLAGS/CXXFLAGS env through to the
      # build, and setting CMAKE_C_FLAGS/CMAKE_CXX_FLAGS pre-defines the var so
      # cmake-rs skips its own /MD injection. Scoped to THIS Windows-debug job
      # only — never committed to config.toml [env] (which cannot cfg-scope), so
      # the Windows release path + Linux/macOS builds are untouched.
      CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreadedDebugDLL
      # llama-cpp-sys-2 defaults LLAMA_LIB_PROFILE=Release -> CMAKE_BUILD_TYPE
      # Release; the VS generator then injects cc's /MD into the per-CONFIG
      # CMAKE_CXX_FLAGS_RELEASE (not the base var), and Release config also means
      # _ITERATOR_DEBUG_LEVEL=0 — both clash with rustc's /MDd (LNK2038 on
      # llama-sampler.obj). Build llama in the Debug config so it picks /MDd +
      # _ITERATOR_DEBUG_LEVEL=2 natively (this is the dedicated knob the build
      # script honors).
      LLAMA_LIB_PROFILE: Debug
      # whisper-rs-sys HARDCODES CMAKE_BUILD_TYPE=RelWithDebInfo in debug builds
      # (config.define wins over a CMAKE_BUILD_TYPE env), so force /MDd via the
      # per-config flag vars for BOTH the RelWithDebInfo (whisper) and Release
      # (llama fallback) configs — these override cmake-rs's per-config /MD
      # injection. Base CFLAGS/CXXFLAGS cover the cc::Build wrapper objects.
      CFLAGS: /MDd
      CXXFLAGS: /MDd
      CMAKE_C_FLAGS: /MDd
      CMAKE_CXX_FLAGS: /MDd
      CMAKE_C_FLAGS_RELEASE: /MDd
      CMAKE_CXX_FLAGS_RELEASE: /MDd
      CMAKE_C_FLAGS_RELWITHDEBINFO: /MDd
      CMAKE_CXX_FLAGS_RELWITHDEBINFO: /MDd
      # NOTE: AUDIOGRAPH_EMBED_WINDOWS_TEST_MANIFEST is deliberately NOT a
      # job-level env. It is for `cargo test` BINARIES (no manifest of their own)
      # — setting it for the `tauri build --debug` APP build (which already has a
      # tauri Common-Controls manifest) produces a duplicate MANIFEST resource
      # and the link aborts (CVT1100 / LNK1123). It is scoped to the cargo-test
      # step below ONLY.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          path: audio-graph

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/src-tauri

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Probe / install Windows system dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --version=3.31.0 -y --no-progress
          }
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm --version=20.1.8 -y --no-progress
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (Test-Path "C:\Program Files\CMake\bin") {
            "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2

      - name: Install frontend dependencies
        working-directory: audio-graph
        run: bun install --frozen-lockfile

      # The load-bearing proof: build the DEFAULT-feature (local-ml) app in the
      # DEBUG profile — the exact path that aborts today — with the CRT override
      # env above. If the override is wrong, the link/build still succeeds but
      # the next step (running debug code that allocs/frees across the ML FFI
      # boundary) aborts with the heap-validator assert.
      - name: Tauri --debug compile smoke (local-ml)
        working-directory: audio-graph
        run: bun run tauri build --debug --no-bundle --ci -- --locked

      # Exercise the debug heap across the whisper/llama FFI alloc/free boundary.
      # On a CI runner an assertion failure aborts the process (no dialog), so a
      # surviving exit-0 here is the real "no is_block_type_valid abort" signal.
      # The test binary (unlike the app) has no manifest, so it needs the SxS
      # test-manifest env (B23) — scoped to THIS step only (see job env note).
      - name: Run debug local-ml lib tests (heap validator must not abort)
        working-directory: audio-graph/src-tauri
        env:
          AUDIOGRAPH_EMBED_WINDOWS_TEST_MANIFEST: '1'
        run: cargo test --locked -p audio-graph --lib whisper -- --nocapture --test-threads=1

  # ── Tauri production path — default features, no bundle ───────────
  # PRs already get the cheaper cloud-only Tauri smoke above. This job keeps
  # the full default-feature app path honest on pushes, manual dispatches, and
  # the nightly schedule without making every PR pay the local-ML compile cost.
  tauri-default-smoke:
    name: Default Tauri smoke (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - os: macos
            runner: blacksmith-6vcpu-macos-15
          - os: windows
            runner: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          path: audio-graph

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake clang libclang-dev pkg-config

      - name: Install macOS system dependencies
        if: matrix.os == 'macos'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: matrix.os == 'windows'

      - name: Probe / install Windows system dependencies
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            Write-Host "Installing cmake"
            choco install cmake --version=3.31.0 -y --no-progress
          } else {
            Write-Host "cmake already present"
          }
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            Write-Host "Installing llvm"
            choco install llvm --version=20.1.8 -y --no-progress
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "llvm already present"
          }
          if (Test-Path "C:\Program Files\CMake\bin") {
            "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2

      - name: Install frontend dependencies
        working-directory: audio-graph
        run: bun install --frozen-lockfile

      - name: Tauri compile smoke (default features, no bundle)
        working-directory: audio-graph
        run: bun run tauri build --no-bundle --ci -- --locked

      - name: Upload default Tauri smoke artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tauri-default-smoke-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            audio-graph/src-tauri/target/release/audio-graph
            audio-graph/src-tauri/target/release/audio-graph.exe

  # ── Rust backend — macOS ───────────────────────────────────────────
  rust-macos:
    name: Rust (macOS)
    runs-on: blacksmith-6vcpu-macos-15
    # See rust-linux above: default features are local-ml, and a cache miss
    # makes this a cold build+test against the same documented 13-20 min
    # native-ML compile cost.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          path: audio-graph

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/src-tauri

      - name: Install system dependencies
        # cmake is already on macos-15 runners; this is a no-op on hit.
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Cargo check
        working-directory: audio-graph/src-tauri
        run: cargo check --locked

      - name: Cargo test
        working-directory: audio-graph/src-tauri
        run: cargo test --locked -- --test-threads=1

  # ── Rust backend — Windows ─────────────────────────────────────────
  rust-windows:
    name: Rust (Windows)
    runs-on: blacksmith-4vcpu-windows-2025
    # See rust-linux above. Windows is the slowest documented leg
    # (docs/WINDOWS_QUICKSTART.md: ~13-15 min for the first release build
    # alone), and this job also runs the full test suite after `cargo check`,
    # so it gets more headroom than the Linux/macOS legs.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          path: audio-graph

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/src-tauri
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # Probe Blacksmith image for preinstalled toolchain. Most Windows-2025
      # images ship cmake + LLVM; only install on miss to avoid pulling
      # unpinned versions from chocolatey on every run.
      - name: Probe / install system dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            Write-Host "Installing cmake"
            choco install cmake --version=3.31.0 -y --no-progress
          } else {
            Write-Host "cmake already present"
          }
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            Write-Host "Installing llvm"
            choco install llvm --version=20.1.8 -y --no-progress
            # choco updates the machine-PATH but the current pwsh session's
            # $env:PATH was captured before the install. Append the standard
            # LLVM bin directory to GITHUB_PATH so subsequent steps see it.
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "llvm already present"
          }
          # Same dance for cmake — its default install lands at C:\Program Files\CMake\bin.
          if (Test-Path "C:\Program Files\CMake\bin") {
            "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify toolchain present
        shell: pwsh
        run: |
          where.exe link.exe
          where.exe cl.exe
          where.exe cmake
          clang --version

      - name: Cargo check
        working-directory: audio-graph/src-tauri
        run: cargo check --locked

      - name: Cargo test
        working-directory: audio-graph/src-tauri
        env:
          AUDIOGRAPH_EMBED_WINDOWS_TEST_MANIFEST: "1"
        run: cargo test --locked -- --test-threads=1

  # ── Seed 2b2c — SurrealDB file-backed storage-engine evidence ──────
  # Evidence-gathering ONLY (manual + nightly), NEVER a PR gate. Closes ADR-0021's
  # gated storage decision by measuring whether SurrealDB's file-backed engines
  # (kv-surrealkv, kv-rocksdb) build, link, fit, and persist per OS. The Linux +
  # Windows-cross-compile legs are already proven locally
  # (docs/reviews/2b2c-local-linux-evidence-2026-06-27.md); the macOS leg is the
  # Apple-hardware-only gap, plus a NATIVE Windows run (the local proof was
  # cross-compile). It builds a THROWAWAY scratch crate (audio-graph/ci/storage-probe,
  # its own workspace, NOT a member of the product workspace) so the product
  # Cargo.toml / Cargo.lock are never touched.
  storage-engine-evidence:
    name: 2b2c storage-engine probe (${{ matrix.os }})
    # Manual + nightly only — this is evidence-gathering, never a PR gate.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: blacksmith-6vcpu-macos-15
          - os: windows
            runner: blacksmith-4vcpu-windows-2025
          - os: linux
            runner: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          path: audio-graph

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/ci/storage-probe

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config

      - name: Install macOS system dependencies
        if: matrix.os == 'macos'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: matrix.os == 'windows'

      - name: Install Windows system dependencies
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # NASM: aws-lc-sys (SurrealDB's rustls crypto backend, pulled by BOTH
          # engines) needs an assembler for its x86_64 crypto asm under MSVC —
          # surfaced by the local cross-compile probe (2b2c evidence doc).
          choco install nasm -y --no-progress
          if (Test-Path "C:\Program Files\NASM") {
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --version=3.31.0 -y --no-progress
          }
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm --version=20.1.8 -y --no-progress
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (Test-Path "C:\Program Files\CMake\bin") {
            "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify toolchain (rustc >= 1.94 for SurrealDB 3.1.x deps)
        working-directory: audio-graph/ci/storage-probe
        shell: bash
        run: |
          rustc --version
          # SurrealDB 3.1.x transitive deps require >= 1.94 (fastnum) / 1.90
          # (roaring); the pinned toolchain (1.95.0) satisfies this. Fail loudly
          # if a future toolchain bump regresses below the floor.
          cargo --version

      # The two engine builds SHARE one target dir, so the binary must be sized
      # immediately after each build (before the next overwrites it) to get an
      # honest per-engine size — mirroring the local evidence doc's method.
      # Windows splits the cargo (link-invoking) steps into a pwsh leg so MSVC's
      # link.exe wins the PATH race. Under `shell: bash` on Windows, Git-Bash's
      # /usr/bin/link (an `ln` shim) shadows MSVC link.exe and the link step
      # fails (`/usr/bin/link: extra operand`). pwsh `Tee-Object` reproduces the
      # bash `tee` evidence-logging with identical artifact paths.
      - name: Build + link + size kv-surrealkv (release)
        id: build-surrealkv
        if: matrix.os != 'windows'
        working-directory: audio-graph/ci/storage-probe
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          start=$(date +%s)
          cargo build --locked --release --features surrealkv 2>&1 | tee "$GITHUB_WORKSPACE/evidence/build-surrealkv-${{ matrix.os }}.log"
          end=$(date +%s)
          {
            echo "=== kv-surrealkv (${{ matrix.os }}) ==="
            echo "build time: $((end - start))s"
            ls -la target/release/durability-probe target/release/durability-probe.exe 2>/dev/null || true
          } | tee -a "$GITHUB_WORKSPACE/evidence/summary-${{ matrix.os }}.txt"

      - name: Build + link + size kv-surrealkv (release, Windows)
        id: build-surrealkv-windows
        if: matrix.os == 'windows'
        working-directory: audio-graph/ci/storage-probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/evidence" | Out-Null
          $start = Get-Date
          cargo build --locked --release --features surrealkv 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/evidence/build-surrealkv-${{ matrix.os }}.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $elapsed = [int]((Get-Date) - $start).TotalSeconds
          $summary = @(
            "=== kv-surrealkv (${{ matrix.os }}) ===",
            "build time: ${elapsed}s",
            (Get-ChildItem target/release/durability-probe.exe -ErrorAction SilentlyContinue | Format-List | Out-String).Trim()
          )
          $summary | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/evidence/summary-${{ matrix.os }}.txt" -Append

      - name: Native-dep inventory (kv-surrealkv)
        if: matrix.os != 'windows'
        working-directory: audio-graph/ci/storage-probe
        shell: bash
        run: |
          cargo tree --locked --features surrealkv > "$GITHUB_WORKSPACE/evidence/tree-surrealkv-${{ matrix.os }}.txt" 2>&1 || true

      - name: Native-dep inventory (kv-surrealkv, Windows)
        if: matrix.os == 'windows'
        working-directory: audio-graph/ci/storage-probe
        shell: pwsh
        run: |
          cargo tree --locked --features surrealkv *> "$env:GITHUB_WORKSPACE/evidence/tree-surrealkv-${{ matrix.os }}.txt"
          exit 0

      - name: Build + link + size kv-rocksdb (release)
        id: build-rocksdb
        if: matrix.os != 'windows'
        working-directory: audio-graph/ci/storage-probe
        shell: bash
        run: |
          start=$(date +%s)
          cargo build --locked --release --features rocksdb 2>&1 | tee "$GITHUB_WORKSPACE/evidence/build-rocksdb-${{ matrix.os }}.log"
          end=$(date +%s)
          {
            echo "=== kv-rocksdb (${{ matrix.os }}) ==="
            echo "build time: $((end - start))s"
            ls -la target/release/durability-probe target/release/durability-probe.exe 2>/dev/null || true
          } | tee -a "$GITHUB_WORKSPACE/evidence/summary-${{ matrix.os }}.txt"

      - name: Build + link + size kv-rocksdb (release, Windows)
        id: build-rocksdb-windows
        if: matrix.os == 'windows'
        working-directory: audio-graph/ci/storage-probe
        shell: pwsh
        run: |
          $start = Get-Date
          cargo build --locked --release --features rocksdb 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/evidence/build-rocksdb-${{ matrix.os }}.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $elapsed = [int]((Get-Date) - $start).TotalSeconds
          $summary = @(
            "=== kv-rocksdb (${{ matrix.os }}) ===",
            "build time: ${elapsed}s",
            (Get-ChildItem target/release/durability-probe.exe -ErrorAction SilentlyContinue | Format-List | Out-String).Trim()
          )
          $summary | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/evidence/summary-${{ matrix.os }}.txt" -Append

      - name: Native-dep inventory (kv-rocksdb)
        if: matrix.os != 'windows'
        working-directory: audio-graph/ci/storage-probe
        shell: bash
        run: |
          cargo tree --locked --features rocksdb > "$GITHUB_WORKSPACE/evidence/tree-rocksdb-${{ matrix.os }}.txt" 2>&1 || true

      - name: Native-dep inventory (kv-rocksdb, Windows)
        if: matrix.os == 'windows'
        working-directory: audio-graph/ci/storage-probe
        shell: pwsh
        run: |
          cargo tree --locked --features rocksdb *> "$env:GITHUB_WORKSPACE/evidence/tree-rocksdb-${{ matrix.os }}.txt"
          exit 0

      - name: Durability probe (best-effort, kill/restart across processes)
        # Best-effort: a failure is LOGGED, not fatal. Durability is evidence,
        # not a gate — `continue-on-error` keeps the job green while still
        # capturing the result in the artifact.
        if: matrix.os != 'windows'
        continue-on-error: true
        working-directory: audio-graph/ci/storage-probe
        shell: bash
        run: |
          set +e
          run_probe() {
            engine="$1"; feature="$2"
            dir="$(mktemp -d)/${engine}-store"
            echo "=== durability probe: ${engine} (best-effort) ===" | tee -a "$GITHUB_WORKSPACE/evidence/durability-${{ matrix.os }}.txt"
            # Writer process: write 5 rows, then exit (process death = the kill proxy).
            cargo run --locked --release --features "${feature}" --bin durability-probe -- write "${dir}" 5 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/evidence/durability-${{ matrix.os }}.txt"
            # Reader process (fresh invocation = "restart"): assert the 5 rows survived.
            cargo run --locked --release --features "${feature}" --bin durability-probe -- read "${dir}" 5 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/evidence/durability-${{ matrix.os }}.txt"
            echo "durability ${engine} exit: $?" | tee -a "$GITHUB_WORKSPACE/evidence/durability-${{ matrix.os }}.txt"
          }
          run_probe surrealkv surrealkv
          run_probe rocksdb rocksdb
          exit 0

      # Windows pwsh leg: `cargo run` may relink, so it must avoid Git-Bash's
      # link.exe shadowing too. Mirrors the bash probe with Tee-Object logging.
      - name: Durability probe (best-effort, kill/restart across processes, Windows)
        if: matrix.os == 'windows'
        continue-on-error: true
        working-directory: audio-graph/ci/storage-probe
        shell: pwsh
        run: |
          $log = "$env:GITHUB_WORKSPACE/evidence/durability-${{ matrix.os }}.txt"
          function Run-Probe($engine, $feature) {
            $dir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.IO.Path]::GetRandomFileName())
            $dir = Join-Path $dir "$engine-store"
            "=== durability probe: $engine (best-effort) ===" | Tee-Object -FilePath $log -Append
            # Writer process: write 5 rows, then exit (process death = the kill proxy).
            cargo run --locked --release --features "$feature" --bin durability-probe -- write "$dir" 5 2>&1 |
              Tee-Object -FilePath $log -Append
            # Reader process (fresh invocation = "restart"): assert the 5 rows survived.
            cargo run --locked --release --features "$feature" --bin durability-probe -- read "$dir" 5 2>&1 |
              Tee-Object -FilePath $log -Append
            "durability $engine exit: $LASTEXITCODE" | Tee-Object -FilePath $log -Append
          }
          Run-Probe surrealkv surrealkv
          Run-Probe rocksdb rocksdb
          exit 0

      - name: Upload 2b2c evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 2b2c-evidence-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 14
          path: evidence/

  # ── Seed 0d66 — Live rsac audio smoke (virtual devices + loopback) ──
  # Real-device e2e: enumerate a virtual capture device, negotiate a capture
  # format, and best-effort capture-back through rsac. Evidence/manual-only
  # (workflow_dispatch || schedule), NEVER a PR gate — PRs keep the lightweight
  # synthetic playback resampling test (rust-cloud-smoke). Per-OS device setup
  # follows docs/research/ci-virtual-audio-devices-2026-06-27.md: LABSN baseline
  # ("a device exists") + a Linux null-sink .monitor shim for guaranteed
  # capture-back; macOS BlackHole. The test it runs is feature-gated behind
  # `live-audio-smoke` so normal/cloud builds never open a device.
  live-audio-smoke:
    name: Live rsac audio smoke (${{ matrix.os }})
    # Manual + nightly only — never a PR gate.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.runner }}
    # Per-OS cap: docs/research/ci-build-test-architecture-2026-08-19.md
    # recorded a scheduled macOS run at ~20 min against ~4 min on Linux
    # (consistent with the managed-macOS AUHAL stall). A single job-wide
    # timeout tight enough for Linux would truncate that macOS evidence
    # before it finishes, so each matrix cell carries its own margin above
    # its observed runtime.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: blacksmith-4vcpu-ubuntu-2404
            timeout: 15
          - os: macos
            runner: blacksmith-6vcpu-macos-15
            timeout: 45
          # The windows leg is HELD on seed d3d3 (VB-CABLE expects a paid license
          # for automated/server use). Add a { os: windows, runner:
          # blacksmith-4vcpu-windows-2025, timeout: 15 } cell once d3d3 resolves
          # the licensing path (or a strictly-FOSS Scream fallback is wired in).
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          path: audio-graph

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo add-apt-repository ppa:pipewire-debian/pipewire-upstream -y
          sudo apt-get update
          # rsac capture IS PipeWire (not raw ALSA): install the runtime daemons
          # so a userspace null-sink + .monitor can be created at job time. The
          # GTK/webkit chain is linked into the audio-graph test binary via Tauri.
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake clang libclang-dev pkg-config xvfb \
            pipewire pipewire-pulse wireplumber pipewire-alsa \
            pulseaudio-utils dbus-x11

      - name: Install macOS system dependencies
        if: matrix.os == 'macos'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      # LABSN baseline: macOS-ONLY. On macOS it installs Background Music and
      # gives a working CoreAudio device baseline. Its Linux path runs
      # `systemctl --user restart pulseaudio`, which fails on the headless
      # Blacksmith runner (no user systemd/D-Bus session: "Failed to connect to
      # bus: No medium found"). Linux instead uses the dbus-run-session PipeWire
      # null-sink + .monitor shim below, which is what rsac actually enumerates
      # (docs/research/ci-virtual-audio-devices-2026-06-27.md). v1 == v1.0.4 ==
      # d08c889.
      - uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
        if: matrix.os == 'macos'

      - name: macOS — install BlackHole virtual audio device
        if: matrix.os == 'macos'
        run: |
          # BlackHole is the rsac-friendly CoreAudio HAL loopback (LABSN installs
          # Background Music; BlackHole is a HAL plugin, not a kext — no reboot).
          brew install blackhole-2ch || true
          # macOS 14.4+: killall (NOT launchctl kickstart -k) to restart the daemon.
          sudo killall coreaudiod || true
          sleep 5
          system_profiler SPAudioDataType | grep -i blackhole || true

      - name: macOS — live rsac audio smoke (feature-gated)
        if: matrix.os == 'macos'
        working-directory: audio-graph/src-tauri
        # macOS has a real (virtual) device + no xvfb needed.
        run: cargo test --locked -p audio-graph --lib --no-default-features --features cloud,live-audio-smoke live_audio -- --nocapture --test-threads=1

      - name: Linux — virtual audio (PipeWire null-sink + .monitor) + live smoke
        if: matrix.os == 'linux'
        working-directory: audio-graph/src-tauri
        run: |
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          chmod 700 "$XDG_RUNTIME_DIR"
          # Run the daemons AND the test inside ONE dbus session so the null-sink
          # outlives the test. rsac enumerates the PipeWire node; the .monitor is
          # the capture-back source.
          dbus-run-session -- bash -euc '
            pipewire & sleep 1
            wireplumber & pipewire-pulse & sleep 2
            # Give the sink an explicit PCM format so the device (and its
            # .monitor capture source) advertise a real format to rsac — a
            # format-less null-sink reports supported_formats=[] and the
            # format-negotiation assertion in the test cannot resolve a format.
            pactl load-module module-null-sink sink_name=ag_sink \
              rate=48000 channels=2 format=s16le \
              sink_properties=device.description=ag_sink
            pactl set-default-sink ag_sink
            pactl set-default-source ag_sink.monitor
            # Enumeration log captured into the upload-on-failure path.
            mkdir -p target/audio-smoke-logs
            pactl info > target/audio-smoke-logs/pactl-info.log 2>&1 || true
            pactl list short sinks > target/audio-smoke-logs/pactl-sinks.log 2>&1 || true
            pactl list short sources > target/audio-smoke-logs/pactl-sources.log 2>&1 || true
            xvfb-run -a cargo test --locked -p audio-graph --lib --no-default-features \
              --features cloud,live-audio-smoke live_audio -- --nocapture --test-threads=1
          '

      - name: Upload enumeration logs on failure
        # always() (not failure()): timeout-minutes CANCELS the job rather
        # than failing it, and failure() is false on cancellation — which is
        # exactly the AUHAL-stall case this upload exists to diagnose.
        # `if: !cancelled()` would be the WRONG fix here: it evaluates false
        # precisely when the job was cancelled, i.e. it would skip the one
        # case this step exists for. always() matches the sibling "Upload
        # 2b2c evidence" step's convention elsewhere in this file.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audio-enum-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 7
          path: audio-graph/src-tauri/target/audio-smoke-logs/

  # ── CI required — single stable status-check name for branch protection ─
  # The individual required-tier job names below churn with matrix cells and
  # renames; branch protection should eventually point at this one job
  # instead (an out-of-band GitHub Settings change, not made by this diff).
  # `if: !cancelled()` (NOT always()) makes this job report even when an
  # upstream required job failed, while still resolving to `cancelled` (not
  # a false `failure`) when THIS run itself was superseded by
  # cancel-in-progress — always() runs even on cancellation, per GitHub's own
  # troubleshooting docs, which is why the check step below no longer treats
  # a `cancelled` need as a failure. classify-optional-feature-paths is in
  # `needs` so a break in the path-classification chain itself (the classify
  # script erroring, the strategy-evaluation failure guarded against on
  # rust-optional-feature-smoke) is caught here too; rust-optional-feature-
  # smoke is deliberately excluded from the "no job may be skipped" list
  # below because it is BY DESIGN skipped on every PR and on any push that
  # touches nothing optional-feature-relevant (see its own `if:` guard) — a
  # real failure inside it still trips the `failure` check.
  ci-required:
    name: CI required
    if: "!cancelled()"
    needs:
      - lints
      - frontend
      - security-audit
      - rust-linux
      - rust-cloud-smoke
      - rust-macos
      - rust-windows
      - classify-optional-feature-paths
      - rust-optional-feature-smoke
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Verify every required job succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          needs.lints.result == 'skipped' ||
          needs.frontend.result == 'skipped' ||
          needs.security-audit.result == 'skipped' ||
          needs.rust-linux.result == 'skipped' ||
          needs.rust-cloud-smoke.result == 'skipped' ||
          needs.rust-macos.result == 'skipped' ||
          needs.rust-windows.result == 'skipped' ||
          needs.classify-optional-feature-paths.result == 'skipped'
        run: |
          echo "::error::one or more required jobs did not succeed: ${{ toJSON(needs) }}"
          exit 1
