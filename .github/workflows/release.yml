# Tag-triggered release build plus manual release dry runs.
#
# Triggers:
# - pushing a git tag matching `v*` (e.g. `v0.2.0`, `v1.0.0-rc.1`)
# - manual workflow_dispatch for dry-run or approval-gated non-dry proof
#
# Non-dry runs create a GitHub Release draft and attach macOS DMG/.app.tar.gz,
# Windows NSIS/standalone exe, Linux AppImage/deb/standalone ELF, and
# Cargo-resolved rsac revision manifests.
#
# Dry runs (`workflow_dispatch` with `dry_run: true`) skip release creation and
# release uploads, build unsigned local artifacts, and upload Actions artifacts
# named `release-dry-run-*`.
#
# Signing is optional. If the `APPLE_*` and `WINDOWS_*` secrets are set,
# tauri-action will sign + notarize. If not, unsigned artifacts ship and
# users will see Gatekeeper / SmartScreen warnings — fine for early
# previews, blocks Gatekeeper/Defender once we have real users.
#
# Cargo.toml pins rsac by full Git revision and the committed Cargo.lock is the
# single release dependency authority. Every metadata/build invocation is locked.
#
# Job layout is deliberately split so only one job ever holds contents:write:
# - `prepare` resolves the release tag + Cargo-locked rsac identity. It makes
#   no API mutation, so it inherits the workflow-level read-only default.
# - `build` runs the untrusted third-party build/sign toolchain (cargo, bun,
#   choco/apt/brew, tauri-action) and holds the code-signing secrets. It
#   builds in tauri-action's build-only mode (no releaseId/tagName, so no
#   GitHub Release API calls) and hands its outputs to `publish` as Actions
#   artifacts. It also inherits the read-only default.
# - `publish` is the only job with contents:write. It creates the draft
#   release and attaches every platform's bundles, rsac manifests, and
#   standalone binaries from the downloaded build artifacts.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build without publishing a release"
        required: false
        default: "false"

# Default minimal token scope. Only the `publish` job elevates to write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Resolve release inputs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
      rsac_version: ${{ steps.rsac.outputs.version }}
      rsac_revision: ${{ steps.rsac.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch: use the latest reachable tag on the selected ref,
            # or a synthetic tag for dry-run evidence on a clean ref.
            tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0-dev")
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Resolve Cargo-locked rsac identity
        id: rsac
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\t' read -r resolved_version resolved_revision < <(
            cargo metadata --format-version 1 --locked |
              node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => { input += chunk; });
                process.stdin.on("end", () => {
                  const packages = JSON.parse(input).packages.filter(pkg => pkg.name === "rsac");
                  const source = packages[0]?.source ?? "";
                  const match = source.match(/^git\+https:\/\/github\.com\/Codeseys-Labs\/rust-crossplat-audio-capture\.git\?rev=([0-9a-f]{40})#([0-9a-f]{40})$/);
                  if (packages.length !== 1 || !match || match[1] !== match[2]) {
                    console.error("unexpected locked rsac package: " + JSON.stringify(packages));
                    process.exit(1);
                  }
                  process.stdout.write(packages[0].version + "\t" + match[2] + "\n");
                });
              '
          )
          if [ -z "$resolved_version" ]; then
            echo "::error::Cargo metadata did not yield an rsac version"
            exit 1
          fi
          if ! printf '%s' "$resolved_revision" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Cargo metadata did not yield a full rsac revision"
            exit 1
          fi
          echo "version=$resolved_version" >> "$GITHUB_OUTPUT"
          echo "revision=$resolved_revision" >> "$GITHUB_OUTPUT"
          {
            echo "### Release inputs"
            echo "- tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Cargo-locked rsac version: \`$resolved_version\`"
            echo "- Cargo-locked rsac revision: \`$resolved_revision\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos"
            runner: blacksmith-6vcpu-macos-15
            args: "--target universal-apple-darwin -- --locked"
            cache_key: "release-macos-universal-apple-darwin"
            build_timeout: 90
          - platform: "linux"
            runner: blacksmith-4vcpu-ubuntu-2404
            args: "-- --locked"
            cache_key: "release-linux-x86_64"
            build_timeout: 45
          - platform: "windows"
            runner: blacksmith-4vcpu-windows-2025
            args: "-- --locked"
            cache_key: "release-windows-x86_64"
            build_timeout: 45
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.build_timeout }}
    steps:
      - name: Checkout audio-graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          path: audio-graph

      # tauri-action builds against the ACTIVE default toolchain — it does not
      # provision its own. A bare `rustup target add` on the runner's default
      # toolchain proved fragile (the x86_64 add did not persist, so the
      # universal-apple-darwin lipo step failed: "Target x86_64-apple-darwin is
      # not installed"). Declaring both Apple targets via the toolchain action
      # is the robust form (tauri-apps/tauri discussion #9419).
      - name: Install Rust toolchain with Apple targets (macOS)
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Rust toolchain (Linux/Windows)
        if: matrix.platform != 'macos'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Cache Rust build (release profile)
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: audio-graph/src-tauri
          key: ${{ matrix.cache_key }}
          # target/ holds prebuilt rlibs + build-script output. Restoring it
          # lets cargo relink existing dependency object code instead of
          # recompiling, and the locked-metadata assertion below only checks
          # resolved version/revision strings, not object code, so it can't
          # detect that. Cache only the registry (.crate archives, which
          # cargo itself checksum-verifies against Cargo.lock) — never the
          # target/ build output.
          cache-targets: false
          # Cache entries are scoped by ref, and a tag push (this workflow's
          # primary trigger) writes to a scope no future run ever reads
          # (each release tag is new). Unrestricted saves therefore just
          # burn the repo-wide 10 GB cache budget — competing with ci.yml's
          # caches — for a write nothing consumes. Restrict saves to the
          # default branch so the only writer is a deliberate action on
          # trunk, not every tag push or every dry-run dispatch.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Discard any cached rsac git checkout
        shell: bash
        run: |
          set -euo pipefail
          # Swatinem/rust-cache unconditionally caches ~/.cargo/git/checkouts
          # (no input disables it, unlike cache-targets above), and GitHub's
          # cache restore does not verify restored bytes against git's
          # content-addressable object model — it just unpacks a tarball. A
          # poisoned cache entry could carry a tampered working tree at the
          # correct pinned rsac revision, and the locked-metadata assertion
          # below only checks the resolved version/revision strings against
          # Cargo.lock (itself checked out fresh, not from cache) — it never
          # inspects file contents, so it would not catch that. Discard the
          # restored checkout so Cargo re-clones and checks out the pinned
          # rev fresh: git's content-addressable model guarantees a working
          # tree that checks out at a given commit hash cannot be swapped
          # for arbitrary content short of a SHA-1 collision.
          rm -rf ~/.cargo/git/checkouts/rust-crossplat-audio-capture-*

      - name: Verify and record Cargo-locked rsac identity
        working-directory: audio-graph/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${{ needs.prepare.outputs.rsac_version }}"
          expected_revision="${{ needs.prepare.outputs.rsac_revision }}"
          IFS=$'\t' read -r resolved_version resolved_revision < <(
            cargo metadata --format-version 1 --locked |
              node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => { input += chunk; });
                process.stdin.on("end", () => {
                  const packages = JSON.parse(input).packages.filter(pkg => pkg.name === "rsac");
                  const source = packages[0]?.source ?? "";
                  const match = source.match(/^git\+https:\/\/github\.com\/Codeseys-Labs\/rust-crossplat-audio-capture\.git\?rev=([0-9a-f]{40})#([0-9a-f]{40})$/);
                  if (packages.length !== 1 || !match || match[1] !== match[2]) {
                    console.error("unexpected locked rsac package: " + JSON.stringify(packages));
                    process.exit(1);
                  }
                  process.stdout.write(packages[0].version + "\t" + match[2] + "\n");
                });
              '
          )
          if [ "$resolved_version" != "$expected_version" ]; then
            echo "::error::Cargo resolved rsac version $resolved_version but release input is $expected_version"
            exit 1
          fi
          if [ "$resolved_revision" != "$expected_revision" ]; then
            echo "::error::Cargo resolved rsac revision $resolved_revision but release input is $expected_revision"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-metadata"
          cat > "$RUNNER_TEMP/release-metadata/rsac-${{ matrix.platform }}.txt" <<EOF
          audio_graph_sha=${GITHUB_SHA}
          rsac_repo=https://github.com/Codeseys-Labs/rust-crossplat-audio-capture.git
          rsac_version=${resolved_version}
          rsac_revision=${resolved_revision}
          platform=${{ matrix.platform }}
          EOF
          {
            echo "### Cargo-locked rsac identity"
            echo "- version: \`$resolved_version\`"
            echo "- revision: \`$resolved_revision\`"
            echo "- platform: \`${{ matrix.platform }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # libasound2-dev supplies the ALSA pkg-config (.pc) that `alsa-sys`
          # (pulled by cpal on Linux) needs — its absence was the Linux release
          # failure ("system library `alsa` ... was not found"). ci.yml's
          # rust-linux job already installs it; this keeps release in sync.
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake clang libclang-dev pkg-config \
            libssl-dev build-essential

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: matrix.platform == 'windows'

      - name: Probe / install Windows system dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            Write-Host "Installing cmake"
            choco install cmake --version=3.31.0 -y --no-progress
          } else {
            Write-Host "cmake already present"
          }
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            Write-Host "Installing llvm"
            choco install llvm --version=20.1.8 -y --no-progress
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "llvm already present"
          }
          if (Test-Path "C:\Program Files\CMake\bin") {
            "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2

      - name: Install frontend dependencies
        working-directory: audio-graph
        run: bun install --frozen-lockfile

      - name: Build + sign via tauri-action
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run != 'true' }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          # Build-only mode: releaseId/tagName are intentionally omitted
          # below, so tauri-action never calls the GitHub Release API —
          # no GITHUB_TOKEN needed and no contents:write required in this
          # job. `publish` attaches the built bundles afterward.
          # ── Apple code signing + notarization (optional) ──────────
          # Set all 6 to enable. Missing any → skip signing (unsigned DMG).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ── Windows Authenticode (optional) ────────────────────────
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # ── Tauri updater signing (optional, separate from OS signing) ──
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: audio-graph
          args: ${{ matrix.args }}

      - name: Build local release artifacts (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        working-directory: audio-graph
        run: bun run tauri build --ci --no-sign ${{ matrix.args }}

      - name: Upload build artifacts for publish
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3
          path: |
            audio-graph/src-tauri/target/**/release/bundle/**
            audio-graph/src-tauri/target/**/release/audio-graph*
            ${{ runner.temp }}/release-metadata/rsac-${{ matrix.platform }}.txt

      - name: Upload dry-run release artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dry-run-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            audio-graph/src-tauri/target/**/release/bundle/**
            audio-graph/src-tauri/target/**/release/audio-graph*
            ${{ runner.temp }}/release-metadata/rsac-${{ matrix.platform }}.txt

  publish:
    name: Publish release
    needs: [prepare, build]
    # Runs whenever `prepare` succeeded, regardless of individual `build`
    # matrix-leg outcomes, so one platform's build failure degrades to a
    # partial release instead of blocking every platform's assets. A matrix
    # job's aggregate `needs.build.result` is "failure" if even ONE leg
    # failed, so it can't distinguish "one platform failed" (should still
    # publish a partial release) from "every platform failed" (should not
    # publish anything) — that floor is enforced below, before release
    # creation, by checking whether any build artifacts actually downloaded.
    # `!cancelled()` (not `always()`) so cancelling the run stops publication
    # instead of still creating/populating a draft release.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (github.event_name == 'push' || github.event.inputs.dry_run != 'true') }}
    permissions:
      # The only job in this workflow that holds contents:write — kept apart
      # from `build`, which runs the untrusted build/sign toolchain and holds
      # the code-signing secrets, and from `prepare`, which never mutates
      # anything.
      contents: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          path: audio-graph

      # A platform whose build failed simply has no artifact to download —
      # degrade to a partial release instead of failing the whole publish.
      # Downloaded (and its zero-artifact floor, next step) BEFORE release
      # creation: if every build leg failed, there is nothing to publish and
      # we must not leave behind an empty draft release that reports green.
      - name: Download build artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-build-*
          merge-multiple: false

      - name: Require at least one platform's build artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(release-build-*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::no build artifacts were downloaded from any platform — every build leg failed (or produced nothing). Refusing to create an empty draft release."
            exit 1
          fi
          echo "Found artifacts for: ${dirs[*]}"

      - name: Create draft GitHub Release
        id: create
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RSAC_RELEASE_VERSION: ${{ needs.prepare.outputs.rsac_version }}
          RSAC_RELEASE_REVISION: ${{ needs.prepare.outputs.rsac_revision }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "${{ needs.prepare.outputs.release_tag }}",
              name: "AudioGraph ${{ needs.prepare.outputs.release_tag }}",
              body: [
                "Automated release. See CHANGELOG.md for details.",
                "",
                "Build inputs:",
                `- rsac version: ${process.env.RSAC_RELEASE_VERSION}`,
                `- rsac revision: ${process.env.RSAC_RELEASE_REVISION}`,
              ].join("\n"),
              draft: true,
              prerelease: false,
            });
            return data.id;
          result-encoding: string

      # ── Standalone (no-install) primary artifacts ──────────────────────
      # Goal: "standalone primary, installer secondary." tauri-action's
      # bundles cover installers + the macOS .app.tar.gz; they do NOT
      # include the bare Windows .exe / Linux ELF. macOS (.app.tar.gz) and
      # Linux (.AppImage) are already no-install standalones, so the only
      # genuine gap is the raw Windows executable — which runs in place
      # (WebView2 is Evergreen on Win11). Attach it (and, for parity, the
      # Linux ELF). Best-effort: never fails the release if a binary or
      # platform artifact is absent.
      - name: Attach bundles, rsac manifests, and standalone binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.release_tag }}"
          ver=$(node -p "require('./audio-graph/package.json').version")

          upload() {
            echo "Uploading $1"
            gh release upload "$tag" "$1" --clobber -R "$GITHUB_REPOSITORY"
          }

          shopt -s nullglob
          dirs=(release-build-*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::warning::no build artifacts were downloaded — nothing to attach"
            exit 0
          fi

          # Tauri-produced installer bundles (dmg, app.tar.gz, nsis exe,
          # AppImage, deb) — upload only the actual deliverables, by
          # extension. tauri-bundler does NOT clean up its staging trees
          # after bundling (macOS `.app/`, the AppImage `.AppDir/`, the deb
          # `control`/`data` staging dir, the dmg support/ template files
          # all persist under bundle/ after the run completes), so a bare
          # `find ... -type f` over `bundle/` would also pick up every file
          # inside those staging trees — hundreds of MB of linuxdeploy-staged
          # libs on Linux, an unversioned `audio-graph` basename colliding
          # across all three platforms' staging binaries under
          # `--clobber`, etc. The extensions below match
          # bundle.targets = ["app", "dmg", "nsis", "appimage", "deb"] in
          # src-tauri/tauri.conf.json and docs/RELEASE.md's artifact
          # taxonomy; update both lists together if bundle.targets changes.
          find "${dirs[@]}" -path '*/release/bundle/*' -type f \( \
              -name '*.dmg' -o \
              -name '*.app.tar.gz*' -o \
              -name '*.AppImage*' -o \
              -name '*.deb' -o \
              -name '*-setup.exe*' \
            \) -print0 |
            while IFS= read -r -d '' f; do upload "$f"; done

          # rsac revision manifests — upload as-is.
          find "${dirs[@]}" -name 'rsac-*.txt' -type f -print0 |
            while IFS= read -r -d '' f; do upload "$f"; done

          win_exe=""
          if [ -d release-build-windows ]; then
            win_exe=$(find release-build-windows -path '*/release/audio-graph.exe' -type f | head -n1)
          fi
          if [ -n "$win_exe" ]; then
            dst="AudioGraph_${ver}_x64_standalone.exe"
            cp "$win_exe" "$dst"
            upload "$dst"
          else
            echo "::warning::standalone exe not found in downloaded artifacts — skipping"
          fi

          linux_bin=""
          if [ -d release-build-linux ]; then
            linux_bin=$(find release-build-linux -path '*/release/audio-graph' -type f | head -n1)
          fi
          if [ -n "$linux_bin" ]; then
            dst="AudioGraph_${ver}_x86_64_standalone"
            cp "$linux_bin" "$dst"
            upload "$dst"
          else
            echo "::warning::standalone binary not found in downloaded artifacts — skipping"
          fi
