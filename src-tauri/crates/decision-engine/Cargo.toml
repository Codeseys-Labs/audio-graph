[package]
name = "audio-graph-decision-engine"
version = "0.1.0-rc.1"
edition = "2024"
publish = false

[features]
default = []
decision-laya = ["dep:ort", "dep:tokenizers", "dep:unicode-script"]
decision-d3 = []
decision-clef = []
cuda = ["ort?/cuda"]
vulkan = ["ort?/directml"]
metal = ["ort?/coreml"]

[dependencies]
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.50.0", features = ["rt"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"], optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
unicode-script = { version = "0.5", optional = true }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
