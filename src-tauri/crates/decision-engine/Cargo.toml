[package]
name = "audio-graph-decision-engine"
version = "0.1.0-rc.1"
edition = "2024"
publish = false

[features]
default = []
decision-laya = ["dep:ort", "dep:tokenizers", "dep:unicode-script"]
# Decision 3.0 on candle (docs/designs/d3-native-runtime-2026-10-18.md). candle-core/candle-nn are the
# versions mistralrs already pins in Cargo.lock.
decision-d3 = ["dep:candle-core", "dep:candle-nn", "dep:half", "dep:rayon", "dep:tokenizers"]
# Clef-flash on the same candle Qwen3.5 encoder (docs/designs/clef-flash-native-2026-10-18.md).
decision-clef = ["dep:candle-core", "dep:candle-nn", "dep:half", "dep:rayon", "dep:tokenizers"]
cuda = ["ort?/cuda", "candle-core?/cuda", "candle-nn?/cuda"]
vulkan = ["ort?/directml"]
metal = ["ort?/coreml", "candle-core?/metal", "candle-nn?/metal"]

[dependencies]
audio-graph-decision-contract = { path = "../decision-contract" }
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.50.0", features = ["rt"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"], optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
unicode-script = { version = "0.5", optional = true }
candle-core = { version = "=0.10.2", optional = true }
candle-nn = { version = "=0.10.2", optional = true }
half = { version = "2", optional = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
