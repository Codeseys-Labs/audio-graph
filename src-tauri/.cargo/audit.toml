# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/config/index.html
#
# Ignored advisories here are reviewed and accepted — not unknown. Each
# advisory MUST sit under one of the categorized blocks below, and each
# block MUST document the source crate, the blocker, and the unblock
# condition. CI fails the `cargo audit` job on any new finding, forcing a
# fresh review and explicit categorization rather than silent drift.

[advisories]

# When you add an entry, copy `cargo audit`'s "Crate:" + "Title:" lines from
# the failing run into the inline comment so a reviewer can grep for context
# without leaving the file.
ignore = [
    # ── Tauri v2 Linux stack: unmaintained gtk-rs / GTK3 bindings ────
    # Source: pulled by Tauri v2's Linux runtime (gtk, gdk, gdkx11, atk,
    # cairo, glib bindings + their -sys / -macros sub-crates).
    # Blocker: Tauri v2 has not yet migrated to GTK4. These are
    # "unmaintained" advisories, not known memory-safety CVEs.
    # Remediation: drop these IDs when Tauri ships GTK4 support.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0429",

    # ── Tauri / mistral.rs / model-loading helpers: unmaintained ─────
    # Source: transitive build/UI helpers — paste, proc-macro-error,
    # number_prefix (progress-display crates), fxhash (selectors /
    # kuchikiki, used by tauri-utils HTML scanning), rust-unic (urlpattern
    # via tauri-utils).
    # Blocker: upstream maintenance, not AudioGraph-owned runtime code.
    # Remediation: drop entries as upstream crates migrate to maintained
    # alternatives.
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2025-0057", # fxhash unmaintained
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2025-0119",

    # ── Resolver-retained rust_decimal rkyv 0.7 edge (inactive) ─────
    # Source: Cargo.lock retains rust_decimal 1.42.1's optional
    # `rkyv = "^0.7.46"` dependency even though no AudioGraph feature enables it.
    # Blocker: rust_decimal 1.42.1 requires optional rkyv ^0.7.46; patched rkyv
    # 0.8.17 is semver-incompatible with that requirement. Manual lock-stanza
    # pruning is resolver-unstable because Cargo retains/re-adds the declared
    # optional edge. Seed audio-graph-c65d separately owns the independent
    # ci/storage-probe lock graph; its resolution is not covered by this ignore.
    # Crate: rkyv  Title: Insufficient archive validation can cause out-of-bounds
    # reads in archives containing Rc/Arc.
    # Reachability: `cargo tree --locked --offline -i rkyv@0.7.46 --target all
    # --all-features --edges all` prints no reverse dependency; default and
    # cloud-only resolution do not contain the package at all. Therefore the
    # affected checked archive-access/deserialization APIs are not compiled into
    # any current AudioGraph feature set.
    # Risk acceptance: lockfile-scanner finding only while that edge stays
    # inactive. Do not use this exception if a feature activates rkyv 0.7.
    # Remediation: remove immediately if any default/cloud/all-features tree makes
    # the command above non-empty. Otherwise remove when rust_decimal drops or
    # raises the optional 0.7 requirement so a targeted lock update prunes it.
    "RUSTSEC-2026-0235", # rkyv 0.7.46: inactive resolver-retained optional edge

    # ── SurrealDB embedded adapter (gated, non-default, conformance-only) ──
    # Source: transitive via the optional `surrealdb-embedded` feature →
    # surrealdb 3.1.x → rsa 0.9.10 (pulled by surrealdb's RPC/auth stack).
    # Crate: rsa  Title: Marvin Attack — potential key-recovery timing sidechannel.
    # Blocker: no fixed upgrade exists (RustSec lists no patched release); the
    # RSA crate's constant-time work is unreleased.
    # Threat model: `surrealdb-embedded` is OFF by default and never ships in a
    # release build (ADR-0021 keeps FileMemoryRepository the sole default store;
    # SurrealDB is a gated conformance target only, kv-mem in tree). No
    # AudioGraph code path performs RSA private-key operations against attacker-
    # observable timing — the embedded KV engine does not use the RPC/TLS auth
    # surface that rsa serves. So the Marvin timing sidechannel is unreachable
    # in any artifact we ship.
    # Remediation: drop when rsa ships a constant-time release, OR permanently if
    # the SurrealDB-embedded option is closed (seed audio-graph-2b2c decision).
    # NOTE: quinn-proto RUSTSEC-2026-0185 (also surrealdb-transitive) is NOT
    # listed here: the committed, `--locked` Cargo.lock resolves a patched
    # quinn-proto. Only add it here if a future pin holds it back.
    "RUSTSEC-2023-0071", # rsa: Marvin Attack (surrealdb-embedded only, no fix)
    # The same gated adapter (surrealdb 3.3.x) carries four more advisories
    # with no semver-compatible fix. Reachability: `cargo tree --locked -i <crate>
    # --target all -e normal` with default features and with
    # `--no-default-features --features cloud` prints nothing for
    # surrealdb-core, crypto-bigint@0.5.5, or quick-xml@0.39; they resolve
    # only under `--all-features`. Remove each entry with the adapter, or when
    # the named upstream fix becomes semver-compatible.
    # Crate: surrealdb-core  Title: Data race and double free via unsound
    # `Send`/`Sync` in `reblessive`. Fix: surrealdb-core >=4.0.0 (major).
    "RUSTSEC-2026-0454",
    # Crate: crypto-bigint 0.5.5 (via jsonwebtoken 10 p256/p384 in surrealdb
    # auth)  Title: Multiple timing variability issues in operations intended
    # to be constant-time. Fix: >=0.7.6, needs elliptic-curve 0.14 upstream.
    # The AWS SDK path already resolves the patched 0.7 line.
    "RUSTSEC-2026-0387",
    # Crate: quick-xml 0.39.4 (via object_store in surrealdb-core)
    # Titles: quadratic duplicate-attribute check; unbounded NsReader
    # namespace allocation. Fix: >=0.41.0, needs an object_store release.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # ── candle-core 0.10 → zip 7.2 (read-only, default-features = false) ──
    # Source: mistralrs 0.8.1 (default `local-ml` → `llm-mistralrs`) requires
    # candle-core ^0.10.2 (as do candle-based backends), which requires
    # zip ^7.2.0. candle-core 0.11 moves only to zip ^8.6; every advisory below
    # needs zip >=9. mistralrs 0.8.1 is the latest release (2026-11-21).
    # Reachability: candle-core builds zip with `default-features = false`
    # (Stored entries only: no AES, no deflate, no legacy Shrink/Reduce/Implode
    # decoders) and only calls `ZipArchive::new` + `by_name` to read local
    # `.npz` / `.pth` weights in `npy.rs` / `pickle.rs`. It never calls
    # `ZipArchive::extract` or `ZipStreamReader`, and AudioGraph code does not
    # depend on zip directly.
    # Remediation: drop these IDs when mistralrs/candle resolve zip >=9, or if
    # a direct zip dependency or an extract call path is added.
    "RUSTSEC-2026-0367", # zip: SUID/SGID bits preserved by extract
    "RUSTSEC-2026-0368", # zip: extract creates escaping symlinks
    "RUSTSEC-2026-0369", # zip: extract applies permissions through symlinks
    "RUSTSEC-2026-0429", # zip: extract aborts on large symlink entry
    "RUSTSEC-2026-0545", # zip: AES entries returned without MAC check
    "RUSTSEC-2026-0546", # zip: extract writes outside destination
    "RUSTSEC-2026-0547", # zip: legacy decoders preallocate declared size
    "RUSTSEC-2026-0548", # zip: ZipStreamReader local/central name mismatch
]
